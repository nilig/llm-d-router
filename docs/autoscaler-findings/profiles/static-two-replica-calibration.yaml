load:
  type: poisson
  interval: 10.0
  stages:
    # Low-rate warmup that does not intentionally saturate the baseline.
    - rate: 2
      duration: 30

    # Narrow ladder around the observed two-replica capacity knee.
    - rate: 2
      duration: 45
    - rate: 3
      duration: 45
    - rate: 4
      duration: 45
    - rate: 5
      duration: 45
    - rate: 6
      duration: 45
    - rate: 8
      duration: 45
    - rate: 10
      duration: 45
  request_timeout: 300.0
api:
  type: completion
  streaming: true
server:
  type: vllm
  model_name: Qwen/Qwen3-32B
  base_url: http://10.16.3.97
  ignore_eos: true
tokenizer:
  pretrained_model_name_or_path: Qwen/Qwen3-32B
data:
  type: shared_prefix
  shared_prefix:
    num_groups: 150
    num_prompts_per_group: 5
    system_prompt_len: 6000
    question_len: 1200
    output_len: 1000
    enable_multi_turn_chat: false
report:
  request_lifecycle:
    summary: true
    per_stage: true
    per_request: true
storage:
  local_storage:
    path: /workspace
