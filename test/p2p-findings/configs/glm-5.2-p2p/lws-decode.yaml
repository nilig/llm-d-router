spec:
  leaderWorkerTemplate:
    restartPolicy: RecreateGroupOnPodRestart
    size: 2
    workerTemplate:
      metadata:
        labels:
          llm-d.ai/accelerator-variant: gpu
          llm-d.ai/accelerator-vendor: nvidia
          llm-d.ai/guide: wide-ep-lws
          llm-d.ai/inference-serving: "true"
          llm-d.ai/model: GLM-5.2-FP8
          llm-d.ai/role: decode
      spec:
        affinity:
          podAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchLabels:
                    llm-d.ai/model: GLM-5.2-FP8
                    llm-d.ai/role: decode
                topologyKey: backend.coreweave.cloud/leafgroup-name
              weight: 100
        containers:
        - args:
          - |-
            find /dev/shm -type f -delete

            # Hotfix: add kv_quant_mode to MLAAttention.get_kv_cache_spec (vllm#48379)
            # PR #47716 fixed deepseek_v4 and sparse_swa but missed mla_attention.py
            python3 -c "
            p='/usr/local/lib/python3.12/dist-packages/vllm/model_executor/layers/attention/mla_attention.py'
            s=open(p).read()
            if 'get_kv_quant_mode' not in s:
              s=s.replace('    MLAAttentionSpec,\n)', '    MLAAttentionSpec,\n    get_kv_quant_mode,\n)')
              s=s.replace('            cache_dtype_str=vllm_config.cache_config.cache_dtype,\n        )',
                          '            cache_dtype_str=vllm_config.cache_config.cache_dtype,\n            kv_quant_mode=get_kv_quant_mode(vllm_config.cache_config.cache_dtype),\n        )')
              open(p,'w').write(s); print('PATCHED mla_attention.py')
            else: print('mla_attention.py already patched')
            "

            # Hotfix: offloading set_ overflow for packed non-uniform KV caches
            # The indexer group's offset+page_size exceeds block_stride in the packed
            # layout. Replace set_() with as_strided() to avoid bounds check failure.
            python3 -c "
            import re
            p='/usr/local/lib/python3.12/dist-packages/vllm/distributed/kv_transfer/kv_connector/v1/offloading/worker.py'
            s=open(p).read()
            pat = (r'(tensors_per_block\[layer_name\] = \(\n)'
                   r'(\s+)torch\.tensor\(\n'
                   r'\s+\[\],\n'
                   r'\s+dtype=torch\.int8,\n'
                   r'\s+device=layer_kv_cache\.device,\n'
                   r'\s+\)\.set_\(\n'
                   r'\s+layer_kv_cache\.untyped_storage\(\),\n'
                   r'\s+byte_offset,\n'
                   r'\s+\(num_blocks, page\),\n'
                   r'\s+\(block_stride_bytes, 1\),\n'
                   r'\s+\),\n'
                   r'(\s+)\)')
            repl = (r'\1'
                    r'\2torch.as_strided(\n'
                    r'\2    torch.empty(0, dtype=torch.int8, device=layer_kv_cache.device).set_(layer_kv_cache.untyped_storage()),\n'
                    r'\2    (num_blocks, page),\n'
                    r'\2    (block_stride_bytes, 1),\n'
                    r'\2    byte_offset,\n'
                    r'\2),\n'
                    r'\3)')
            new_s, n = re.subn(pat, repl, s)
            if n > 0:
              open(p,'w').write(new_s); print('PATCHED worker.py')
            else:
              print('worker.py: no match for set_ pattern')
            "

            # Scale MAX_TOKENS with number of decode pods
            export MAX_TOKENS=$(( ${MAX_TOKENS_PER_NODE:-128} * LWS_GROUP_SIZE ))

            # Wide-EP (multi-node): reserve VRAM for NVSHMEM symmetric heap
            GPU_MEM_UTIL=${DECODE_GPU_MEM_UTIL:-0.95}

            # DSpark speculative decoding (multi-node only — single-node is memory-bandwidth bound)
            SPEC_ARGS=""
            # bf16/auto KV - same fp8 sparse-MLA crash workaround as
            # prefill.yaml; see comment there and PINNED-IMAGES.md.
            KV_CACHE_DTYPE_ARGS=""
            MAX_BATCHED_TOKENS=${MAX_TOKENS}
            MAX_SEQS=${MAX_TOKENS}
            if [ "${ENABLE_DSPARK:-0}" = "1" ] && [ "${LWS_GROUP_SIZE:-1}" -gt 1 ]; then
              GPU_MEM_UTIL=$(python3 -c "print(round($GPU_MEM_UTIL - 0.07, 2))")
              MAX_SEQS=$(( MAX_TOKENS / 4 ))
              MAX_BATCHED_TOKENS=$(( MAX_SEQS * (DSPARK_NUM_TOKENS + 1) ))
              SPEC_ARGS="--speculative-config {\"model\":\"${DSPARK_MODEL}\",\"num_speculative_tokens\":${DSPARK_NUM_TOKENS},\"method\":\"dspark\"}"
              KV_CACHE_DTYPE_ARGS=""
            fi

            # DeepEP low-latency requires: qp_depth >= (max_dispatch_tokens + 1) * 2
            export NVSHMEM_QP_DEPTH=$(( (MAX_BATCHED_TOKENS + 1) * 2 ))

            MTP_ARGS=""
            if [ "${ENABLE_MTP:-1}" = "1" ]; then
              MTP_ARGS="--speculative-config {\"method\":\"mtp\",\"num_speculative_tokens\":${MTP_NUM_TOKENS:-3}}"
            fi

            START_RANK=$(( ${LWS_WORKER_INDEX:-0} * DP_SIZE_LOCAL ))

            PROFILER_ARGS=""
            if [ "${ENABLE_PROFILING:-0}" = "1" ]; then
              mkdir -p /var/cache/vllm/profile
              PROFILER_ARGS="--profiler-config {\"profiler\":\"torch\",\"torch_profiler_dir\":\"/var/cache/vllm/profile\",\"torch_profiler_record_shapes\":true,\"torch_profiler_with_memory\":true,\"max_iterations\":3}"
            fi

            # P2P: the base's inline NixlConnector-only kv_transfer_config is
            # replaced by the same MultiConnector as the prefill pool - NIXL
            # (P/D transfer) plus tiered offloading with the P2P secondary
            # tier, per the p2p guide's "P/D variant" JSON. Deltas vs that
            # guide JSON:
            # - cpu_bytes_to_use spliced from KV_OFFLOAD_CPU_BYTES (default
            #   107374182400 = 100 GiB; per rank -> 8 x 100 GiB per pod).
            # - eviction_policy lru kept from the base prefill's tiered mode.
            # - kv_load_failure_policy fail kept from the base, both at the
            #   MultiConnector level and on the Nixl entry - MultiConnector
            #   children do not inherit the top-level field.
            # - p2p tier host is this pod's IP; vLLM offsets the 7777 base
            #   port by each engine's GLOBAL DP rank (leader pod binds
            #   7777-7784, worker pod 7785-7792).
            KV_TRANSFER_CONFIG='{"kv_connector":"MultiConnector",
                                  "kv_role":"kv_both",
                                  "kv_load_failure_policy":"fail",
                                  "kv_connector_extra_config":{
                                    "connectors":[
                                      {"kv_connector":"NixlConnector","kv_role":"kv_both",
                                       "kv_load_failure_policy":"fail"},
                                      {"kv_connector":"OffloadingConnector","kv_role":"kv_both",
                                       "kv_connector_extra_config":{
                                         "spec_name":"TieringOffloadingSpec",
                                         "cpu_bytes_to_use":'"${KV_OFFLOAD_CPU_BYTES:-107374182400}"',
                                         "offload_prompt_only":false,
                                         "eviction_policy":"lru",
                                         "secondary_tiers":[{"type":"p2p","host":"'"${POD_IP}"'","port":7777}]
                                    }}]}}'

            # P2P: KV events feed the router's precise prefix index. vLLM
            # offsets the ZMQ bind port (5557) by each engine's GLOBAL DP
