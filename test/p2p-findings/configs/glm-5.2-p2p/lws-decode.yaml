            # topic names port 8000 - the routing-proxy serving base that
            # the EPP sees as this pod's endpoints (vLLM itself binds
            # 8200-8207) - and the EPP remaps it per rank (SPEC.md, A2).
            KV_EVENTS_CONFIG='{"enable_kv_cache_events":true,"publisher":"zmq","endpoint":"tcp://*:5557","topic":"kv@'"${POD_IP}"':8000@zai-org/GLM-5.2-FP8"}'

