ding/worker.py'\ns=open(p).read()\npat = (r'(tensors_per_block\\[layer_name\\] = \\(\\n)'\n       r'(\\s+)torch\\.tensor\\(\\n'\n       r'\\s+\\[\\],\\n'\n       r'\\s+dtype=torch\\.int8,\\n'\n       r'\\s+device=layer_kv_cache\\.device,\\n'\n       r'\\s+\\)\\.set_\\(\\n'\n       r'\\s+layer_kv_cache\\.untyped_storage\\(\\),\\n'\n       r'\\s+byte_offset,\\n'\n       r'\\s+\\(num_blocks, page\\),\\n'\n       r'\\s+\\(block_stride_bytes, 1\\),\\n'\n       r'\\s+\\),\\n'\n       r'(\\s+)\\)')\nrepl = (r'\\1'\n        r'\\2torch.as_strided(\\n'\n        r'\\2    torch.empty(0, dtype=torch.int8, device=layer_kv_cache.device).set_(layer_kv_cache.untyped_storage()),\\n'\n        r'\\2    (num_blocks, page),\\n'\n        r'\\2    (block_stride_bytes, 1),\\n'\n        r'\\2    byte_offset,\\n'\n        r'\\2),\\n'\n        r'\\3)')\nnew_s, n = re.subn(pat, repl, s)\nif n \u003e 0:\n  open(p,'w').write(new_s); print('PATCHED worker.py')\nelse:\n  print('worker.py: no match for set_ pattern')\n\"\n\n# Scale MAX_TOKENS with number of decode pods\nexport MAX_TOKENS=$(( ${MAX_TOKENS_PER_NODE:-128} * LWS_GROUP_SIZE ))\n\n# Wide-EP (multi-node): reserve VRAM for NVSHMEM symmetric heap\nGPU_MEM_UTIL=${DECODE_GPU_MEM_UTIL:-0.95}\n\n# DSpark speculative decoding (multi-node only — single-node is memory-bandwidth bound)\nSPEC_ARGS=\"\"\n# bf16/auto KV - same fp8 sparse-MLA crash workaround as\n# prefill.yaml; see comment there and PINNED-IMAGES.md.\nKV_CACHE_DTYPE_ARGS=\"\"\nMAX_BATCHED_TOKENS=${MAX_TOKENS}\nMAX_SEQS=${MAX_TOKENS}\nif [ \"${ENABLE_DSPARK:-0}\" = \"1\" ] \u0026\u0026 [ \"${LWS_GROUP_SIZE:-1}\" -gt 1 ]; then\n  GPU_MEM_UTIL=$(python3 -c \"print(round($GPU_MEM_UTIL - 0.07, 2))\")\n  MAX_SEQS=$(( MAX_TOKENS / 4 ))\n  MAX_BATCHED_TOKENS=$(( MAX_SEQS * (DSPARK_NUM_TOKENS + 1) ))\n  SPEC_ARGS=\"--speculative-config {\\\"model\\\":\\\"${DSPARK_MODEL}\\\",\\\"num_speculative_tokens\\\":${DSPARK_NUM_TOKENS},\\\"method\\\":\\\"dspark\\\"}\"\n  KV_CACHE_DTYPE_ARGS=\"\"\nfi\n\n# DeepEP low-latency requires: qp_depth \u003e= (max_dispatch_tokens + 1) * 2\nexport NVSHMEM_QP_DEPTH=$(( (MAX_BATCHED_TOKENS + 1) * 2 ))\n\nMTP_ARGS=\"\"\nif [ \"${ENABLE_MTP:-1}\" = \"1\" ]; then\n  MTP_ARGS=\"--speculative-config {\\\"method\\\":\\\"mtp\\\",\\\"num_speculative_tokens\\\":${MTP_NUM_TOKENS:-3}}\"\nfi\n\nSTART_RANK=$(( ${LWS_WORKER_INDEX:-0} * DP_SIZE_LOCAL ))\n\nPROFILER_ARGS=\"\"\nif [ \"${ENABLE_PROFILING:-0}\" = \"1\" ]; then\n  mkdir -p /var/cache/vllm/profile\n  PROFILER_ARGS=\"--profiler-config {\\\"profiler\\\":\\\"torch\\\",\\\"torch_profiler_dir\\\":\\\"/var/cache/vllm/profile\\\",\\\"torch_profiler_record_shapes\\\":true,\\\"torch_profiler_with_memory\\\":true,\\\"max_iterations\\\":3}\"\nfi\n\n# P2P: the base's inline NixlConnector-only kv_transfer_config is\n# replaced by the same MultiConnector as the prefill pool - NIXL\n# (P/D transfer) plus tiered offloading with the P2P secondary\n# tier, per the p2p guide's \"P/D variant\" JSON. Deltas vs that\n# guide JSON:\n# - cpu_bytes_to_use spliced from KV_OFFLOAD_CPU_BYTES (default\n#   107374182400 = 100 GiB; per rank -\u003e 8 x 100 GiB per pod).\n# - eviction_policy lru kept from the base prefill's tiered mode.\n# - kv_load_failure_policy fail kept from the base, both at the\n#   MultiConnector level and on the Nixl entry - MultiConnector\n#   children do not inherit the top-level field.\n# - p2p tier host is this pod's IP; vLLM offsets the 7777 base\n#   port by each engine's GLOBAL DP rank (leader pod binds\n#   7777-7784, worker pod 7785-7792).\nKV_TRANSFER_CONFIG='{\"kv_connector\":\"MultiConnector\",\n                      \"kv_role\":\"kv_both\",\n                      \"kv_load_failure_policy\":\"fail\",\n                      \"kv_connector_extra_config\":{\n                        \"connectors\":[\n                          {\"kv_connector\":\"NixlConnector\",\"kv_role\":\"kv_both\",\n                           \"kv_load_failure_policy\":\"fail\"},\n                          {\"kv_connector\":\"OffloadingConnector\",\"kv_role\":\"kv_both\",\n                           \"kv_connector_extra_config\":{\n                             \"spec_name\":\"TieringOffloadingSpec\",\n                             \"cpu_bytes_to_use\":'\"${KV_OFFLOAD_CPU_BYTES:-107374182400}\"',\n                             \"offload_prompt_only\":false,\n                             \"eviction_policy\":\"lru\",\n                             \"secondary_tiers\":[{\"type\":\"p2p\",\"host\":\"'\"${POD_IP}\"'\",\"port\":7777}]\n                        }}]}}'\n\n# P2P: KV events feed the router's precise prefix index. vLLM\n# offsets the ZMQ bind port (5557) by each engine's GLOBAL DP\n# rank (leader pod binds 5557-5564, worker pod 5565-5572); the\n# topic names port 8000 - the routing-proxy serving base that\n# the EPP sees as this pod's endpoints (vLLM itself binds\n# 8200-8207) - and the EPP remaps it per rank (SPEC.md, A2).\nKV_EVENTS_CONFIG='{\"enable_kv_cache_events\":true,\"publisher\":\"zmq\",\"endpoint\":\"tcp://*:5557\",\"topic\":\"kv@'\"${POD_IP}\"':8000@zai-org/GLM-5.2-FP8\"}'\n\nexec vllm serve $PROFILER_ARGS $SPEC_ARGS $MTP_ARGS $KV_CACHE_DTYPE_ARGS \\\n  zai-org/GLM-5.2-FP8 \\\n  --port 8200 \\\n  --trust-remote-code \\\n  --gpu-memory-utilization $GPU_MEM_UTIL \\\n  --max-model-len ${MAX_MODEL_LEN:-120000} \\\n  --disable-access-log-for-endpoints=/health,/metrics \\\n  --data-parallel-multi-port-external-lb \\\n  --data-parallel-supervisor-port=8208 \\\n  --enable-expert-parallel \\\n  --tensor-parallel-size $TP_SIZE \\\n  --max-num-batched-tokens ${MAX_BATCHED_TOKENS} \\\n  --max-num-seqs ${MAX_SEQS} \\\n  --data-parallel-size $((LWS_GROUP_SIZE * DP_SIZE_LOCAL)) \\\n  --data-parallel-size-local $DP_SIZE_LOCAL \\\n  --data-parallel-address ${LWS_LEADER_ADDRESS} \\\n  --data-parallel-rpc-port 5555 \\\n  --data-parallel-start-rank $START_RANK \\\n  --kv_transfer_config \"$KV_TRANSFER_CONFIG\" \\\n  --kv-events-config \"$KV_EVENTS_CONFIG\" \\\n  --all2all-backend deepep_low_latency \\\n  --moe-backend deep_gemm \\\n  --reasoning-parser glm45 \\\n  --tool-call-parser glm47 \\\n  --enable-auto-tool-choice \\\n  ${KV_CACHE_MEMORY_BYTES:+--kv-cache-memory-bytes=$KV_CACHE_MEMORY_BYTES}"],"command":["/bin/bash","-c"],"env":[{"name":"HF_TOKEN","valueFrom":{"secretKeyRef":{"key":"HF_TOKEN","name":"llm-d-hf-token"}}},{"name":"HF_HOME","value":"/mnt/hf-cache"},{"name":"DECODE_GPU_MEM_UTIL","value":""},{"name":"MAX_MODEL_LEN","value":"119990"},{"name":"ENABLE_PROFILING","value":"0"},{"name":"ENABLE_MTP","value":"0"},{"name":"MTP_NUM_TOKENS","value":"3"},{"name":"ENABLE_DSPARK","value":"0"},{"name":"DSPARK_MODEL","value":"RedHatAI/GLM-5.2-speculator.dspark"},{"name":"DSPARK_NUM_TOKENS","value":"7"},{"name":"VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS","value":"1"},{"name":"MAX_TOKENS_PER_NODE","value":"32"},{"name":"DP_SIZE_LOCAL","value":"8"},{"name":"TP_SIZE","value":"1"},{"name":"KV_OFFLOAD_CPU_BYTES","value":"107374182400"},{"name":"TRITON_LIBCUDA_PATH","value":"/usr/lib64"},{"name":"VLLM_SKIP_P2P_CHECK","value":"1"},{"name":"VLLM_RANDOMIZE_DP_DUMMY_INPUTS","value":"1"},{"name":"VLLM_USE_DEEP_GEMM","value":"1"},{"name":"NVIDIA_GDRCOPY","value":"enabled"},{"name":"NVSHMEM_REMOTE_TRANSPORT","value":"ibgda"},{"name":"NVSHMEM_IB_ENABLE_IBGDA","value":"true"},{"name":"NVSHMEM_BOOTSTRAP_UID_SOCK_IFNAME","value":"eth0"},{"name":"GLOO_SOCKET_IFNAME","value":"eth0"},{"name":"NCCL_SOCKET_IFNAME","value":"eth0"},{"name":"NCCL_IB_HCA","value":"ibp"},{"name":"NVSHMEM_HCA_PREFIX","value":"ibp"},{"name":"VLLM_MOE_DP_CHUNK_SIZE","value":"${MAX_TOKENS}"},{"name":"VLLM_COMPUTE_NANS_IN_LOGITS","value":"1"},{"name":"VLLM_HTTP_TIMEOUT_KEEP_ALIVE","value":"120"},{"name":"VLLM_LOGGING_LEVEL","value":"INFO"},{"name":"PYTHONHASHSEED","value":"0"},{"name":"VLLM_NIXL_SIDE_CHANNEL_HOST","valueFrom":{"fieldRef":{"fieldPath":"status.podIP"}}},{"name":"VLLM_P2P_SIDE_CHANNEL_HOST","valueFrom":{"fieldRef":{"fieldPath":"status.podIP"}}},{"name":"POD_IP","valueFrom":{"