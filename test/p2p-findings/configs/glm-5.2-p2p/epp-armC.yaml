# Arm C (hybrid): precise prefix-affinity PLACEMENT + P2P pull as the
# miss-rescue path. Identical to armB-plugins.yaml except the prefill
# profile also scores prefix-cache affinity from the SAME precise per-rank
# index the p2p-source-producer uses - requests prefer warm ranks, and the
# pull only fires when placement cannot find one (or the warm rank is
# overloaded and queue/active scores dominate).
# Motivation: armB (load-only placement) measured recompute 24.8/22.5/28.7%
# at c16/c32/c64 vs armA affinity's 11.7/10.5/10.8% - movement cannot
# substitute for affinity; it should complement it.
apiVersion: llm-d.ai/v1alpha1
kind: EndpointPickerConfig
plugins:
- type: disagg-headers-handler
- type: always-disagg-pd-decider
- type: disagg-profile-handler
  parameters:
    deciderPluginName: always-disagg-pd-decider
- type: prefill-filter
- type: decode-filter
- type: token-producer
  parameters:
    modelName: zai-org/GLM-5.2-FP8
    vllm:
      url: http://render:8000
- type: endpoint-notification-source
- type: metrics-data-source
  parameters: {scheme: "http", path: "/metrics", insecureSkipVerify: true}
- type: core-metrics-extractor
- type: precise-prefix-cache-producer
  parameters:
    tokenProcessorConfig:
      blockSize: 64
    kvEventsConfig:
      topicFilter: "kv@"
      discoverPods: true
      dataParallelSizeLocal: 8
      servingPortBase: 8000
      podDiscoveryConfig:
        socketPort: 5557
        dataParallelSizeTotal: 16
- type: prefix-cache-scorer
  name: precise-prefix-cache-scorer
  parameters:
    prefixMatchInfoProducerName: precise-prefix-cache-producer
- type: p2p-source-producer
  parameters:
    prefixMatchInfoProducerName: precise-prefix-cache-producer
    prefillProfileName: prefill
    minCachedTokenDelta: 2048
    p2pPortBase: 7777
- type: queue-scorer
- type: active-request-scorer
dataLayer:
  sources:
  - pluginRef: metrics-data-source
    extractors:
    - pluginRef: core-metrics-extractor
  - pluginRef: endpoint-notification-source
    extractors:
    - pluginRef: precise-prefix-cache-producer
schedulingProfiles:
- name: prefill
  plugins:
  - pluginRef: prefill-filter
  - pluginRef: precise-prefix-cache-scorer
    weight: 5
  - pluginRef: queue-scorer
    weight: 3
  - pluginRef: active-request-scorer
    weight: 1
- name: decode
  plugins:
  - pluginRef: decode-filter
  - pluginRef: active-request-scorer
    weight: 3
