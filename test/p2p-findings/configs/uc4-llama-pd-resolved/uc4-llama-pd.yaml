---
apiVersion: v1
kind: Service
metadata: {name: uc4-llama-decode, namespace: nilig-p2p}
spec:
  selector: {app: uc4-llama, role: decode}
  ports: [{name: proxy, port: 8000, targetPort: 8000}, {name: kv-events, port: 5556, targetPort: 5556}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: uc4-llama-render, namespace: nilig-p2p}
spec:
  replicas: 2
  selector: {matchLabels: {app: uc4-llama-render}}
  template:
    metadata: {labels: {app: uc4-llama-render}}
    spec:
      automountServiceAccountToken: false
      containers:
      - name: vllm-render
        image: docker.io/vllm/vllm-openai-cpu:v0.23.0
        command: ["vllm", "launch", "render", "meta-llama/Llama-3.1-8B-Instruct", "--port=8000"]
        env:
        - {name: HF_TOKEN, valueFrom: {secretKeyRef: {name: llm-d-hf-token, key: HF_TOKEN}}}
        - {name: HOME, value: /tmp}
        ports: [{containerPort: 8000}]
        resources: {requests: {cpu: "2", memory: 8Gi}, limits: {memory: 16Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: uc4-llama-render, namespace: nilig-p2p}
spec:
  selector: {app: uc4-llama-render}
  ports: [{port: 8000, targetPort: 8000}]
