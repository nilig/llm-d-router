# Scenario B (hot set) re-validation, arm: load, no pull - the recompute control that isolates P2P
# Plugin body is guides/p2p-kv-cache-sharing/benchmarking/epp-load.yaml verbatim,
# wrapped in the helm values scaffold and pointed at the scend-agg pods.
router:
  epp:
    image: { tag: main, pullPolicy: Always }
    pluginsConfigFile: "sb2.yaml"
    pluginsCustomConfig:
      sb2.yaml: |
        apiVersion: llm-d.ai/v1alpha1
        kind: EndpointPickerConfig
        # Control arm: load-balanced placement WITHOUT the pull. Every cross-pod
        # request recomputes its prefix - this arm isolates the pull's
        # contribution when compared against epp-load-p2p.yaml (identical
        # placement). Match modelName and the render Service URL to your
        # deployment.
        plugins:
        - type: token-producer
          parameters:
            modelName: openai/gpt-oss-120b
            vllm:
              url: http://gptoss-render:8000
        - type: endpoint-notification-source
        - type: metrics-data-source
          parameters: {scheme: "http", path: "/metrics", insecureSkipVerify: true}
        - type: core-metrics-extractor
        - type: precise-prefix-cache-producer
          parameters:
            tokenProcessorConfig:
              blockSize: 64
            kvEventsConfig:
              topicFilter: "kv@"
              discoverPods: true
              podDiscoveryConfig:
                socketPort: 5556
        - type: queue-scorer
        - type: kv-cache-utilization-scorer
        - type: weighted-random-picker
        - type: single-profile-handler
        dataLayer:
          sources:
          - pluginRef: metrics-data-source
            extractors:
            - pluginRef: core-metrics-extractor
          - pluginRef: endpoint-notification-source
            extractors:
            - pluginRef: precise-prefix-cache-producer
        schedulingProfiles:
        - name: default
          plugins:
          - pluginRef: weighted-random-picker
          - pluginRef: queue-scorer
            weight: 3
          - pluginRef: kv-cache-utilization-scorer
            weight: 2
  modelServers:
    matchLabels: { llm-d.ai/uc: scend }
