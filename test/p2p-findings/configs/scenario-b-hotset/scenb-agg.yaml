---
# Scenario B - hot set (the guide's "payoff case"). Fills the 2 arms missing
# from the guide's own table: affinity+P2P (the shipped default, untested in
# the payoff case) and load-no-P2P (the recompute floor).
#
# Topology: 16x gpt-oss-120b aggregated, TP=1, H200 - the SAME topology the
# guide's own Scenario A/B numbers were measured on (guides/p2p-kv-cache-sharing
# /modelserver/gpu/vllm/{kustomization,patch-vllm,patch-sidecar}.yaml), built
# as a flat manifest instead of via kustomize for direct reuse of this
# session's runner-script pattern (scenC_runarm.sh style).
#
# Image + overlay: vllm/vllm-openai:nightly-1240c74c0a47473449cf0c3a9c2d87a1e159f73b
# + the combined-overlay-uc2resume ConfigMap (11 files: #48021-merged P2P tier
# base + #49877 round-scoping fix + #49850 hit_pending_deadline fix,
# hand-merged). This is "the fixed stack" this session re-validated UC2/UC3/
# UC4/Scenario C on - same image+overlay reused here for consistency, and
# because the plain nightly tag alone still lacks #49877/#49850 (both still
# draft upstream), which is what caused the original UC2 lookup-hang.
#
# Sidecar wiring matches the guide's patch-sidecar.yaml verbatim
# (--kv-connector=offloading, no --enable-p2p-pull - that flag only applies
# to --kv-connector=nixlv2 per pkg/sidecar/proxy/options.go:545-546; offloading
# mode's pull is enabled by the connector choice alone, pkg/sidecar/proxy/
# connector_p2p.go:217-219). Every pod is both puller and source.
#
# Render: reuses the existing gptoss-render Service (already scaled 1->6
# replicas before this run - a single replica caps ~10.5 req/s tokenizing
# 48K prompts and silently contaminates every stage >=12 req/s with a flat
# 5s render-timeout plateau in BOTH arms identically, per
# project_render_bottleneck_5s_plateau). The guide's own epp-affinity-p2p.yaml
# and epp-load.yaml hardcode token-producer url http://gptoss-render:8000,
# which is exactly this service's name - no adjustment needed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scenb-agg
  namespace: nilig-p2p
  labels: {app: scenb-agg}
spec:
  replicas: 16
  selector: {matchLabels: {app: scenb-agg}}
  template:
    metadata:
      labels:
        app: scenb-agg
        llm-d.ai/role: decode
        llm-d.ai/inferenceServing: "true"
        llm-d.ai/uc: scenb
    spec:
      initContainers:
      - name: routing-proxy
        image: quay.io/niliguy/llm-d-router-disagg-sidecar:p2p-rename-43aea48e
        args:
        - --port=8000
        - --vllm-port=8200
        - --kv-connector=offloading
        - --p2p-connector-port=7777
        - --secure-proxy=false
        env:
        - {name: POD_IP, valueFrom: {fieldRef: {fieldPath: status.podIP}}}
        ports: [{containerPort: 8000, name: proxy}]
        restartPolicy: Always
        securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true}
      containers:
      - name: modelserver
        image: vllm/vllm-openai:nightly-1240c74c0a47473449cf0c3a9c2d87a1e159f73b
        command: ["sh", "-c", "rm -f /dev/shm/vllm_offload_*.mmap 2>/dev/null; exec vllm serve \"$@\"", "sh"]
        args:
        - openai/gpt-oss-120b
        - --port=8200
        - --disable-access-log-for-endpoints=/health,/metrics,/v1/models
        - --tensor-parallel-size=1
        - --block-size=64
        - --max-model-len=65536
        - --gpu-memory-utilization=0.85
        - --kv-transfer-config
        - '{"kv_connector":"OffloadingConnector","kv_role":"kv_both","kv_connector_extra_config":{"spec_name":"TieringOffloadingSpec","cpu_bytes_to_use":94489280512,"offload_prompt_only":false,"secondary_tiers":[{"type":"p2p","host":"$(POD_IP)","port":7777}]}}'
        - --kv-events-config
        - '{"enable_kv_cache_events":true,"publisher":"zmq","endpoint":"$(KV_EVENTS_ENDPOINT)","topic":"kv@$(POD_IP):$(POD_PORT)@openai/gpt-oss-120b"}'
        env:
        - {name: HF_TOKEN, valueFrom: {secretKeyRef: {name: llm-d-hf-token, key: HF_TOKEN}}}
        - {name: POD_IP, valueFrom: {fieldRef: {fieldPath: status.podIP}}}
        - {name: VLLM_P2P_SIDE_CHANNEL_HOST, valueFrom: {fieldRef: {fieldPath: status.podIP}}}
        - {name: PYTHONHASHSEED, value: "0"}
        - {name: KV_EVENTS_ENDPOINT, value: "tcp://*:5556"}
        - {name: POD_PORT, value: "8000"}
        - {name: HOME, value: /tmp}
        - {name: DO_NOT_TRACK, value: "1"}
        ports:
        - {containerPort: 8200, name: http}
        - {containerPort: 7777, name: p2p}
        - {containerPort: 5556, name: kv-events}
        resources:
          limits: {cpu: "8", memory: 160Gi, nvidia.com/gpu: "1"}
          requests: {cpu: "8", memory: 160Gi, nvidia.com/gpu: "1"}
        volumeMounts:
        - {name: dshm, mountPath: /dev/shm}
        - {name: torch-compile-cache, mountPath: /.cache}
        - {name: triton-cache, mountPath: /.triton}
        - {name: vllm-config, mountPath: /.config}
        - { name: gp2p, mountPath: /usr/local/lib/python3.12/dist-packages/vllm/v1/kv_offload/base.py, subPath: base.py }
        - { name: gp2p, mountPath: /usr/local/lib/python3.12/dist-packages/vllm/v1/kv_offload/tiering/p2p/manager.py, subPath: manager.py }
        - { name: gp2p, mountPath: /usr/local/lib/python3.12/dist-packages/vllm/v1/kv_offload/tiering/p2p/session/__init__.py, subPath: session___init__.py }
        - { name: gp2p, mountPath: /usr/local/lib/python3.12/dist-packages/vllm/v1/kv_offload/tiering/p2p/session/client.py, subPath: session_client.py }
        - { name: gp2p, mountPath: /usr/local/lib/python3.12/dist-packages/vllm/v1/kv_offload/tiering/p2p/session/protocol.py, subPath: session_protocol.py }
        - { name: gp2p, mountPath: /usr/local/lib/python3.12/dist-packages/vllm/v1/kv_offload/tiering/p2p/session/server.py, subPath: session_server.py }
        - { name: gp2p, mountPath: /usr/local/lib/python3.12/dist-packages/vllm/v1/kv_offload/tiering/p2p/session/session.py, subPath: session_session.py }
        - { name: gp2p, mountPath: /usr/local/lib/python3.12/dist-packages/vllm/v1/kv_offload/tiering/p2p/control/zmq.py, subPath: control_zmq.py }
        - { name: gp2p, mountPath: /usr/local/lib/python3.12/dist-packages/vllm/v1/kv_offload/tiering/p2p/control/base.py, subPath: control_base.py }
        - { name: gp2p, mountPath: /usr/local/lib/python3.12/dist-packages/vllm/distributed/kv_transfer/kv_connector/v1/offloading/scheduler.py, subPath: offloading_scheduler.py }
        - { name: gp2p, mountPath: /usr/local/lib/python3.12/dist-packages/vllm/distributed/kv_transfer/kv_connector/v1/offloading/metrics.py, subPath: offloading_metrics.py }
        startupProbe: {httpGet: {path: /health, port: 8200}, initialDelaySeconds: 30, periodSeconds: 15, failureThreshold: 80}
        readinessProbe: {httpGet: {path: /health, port: 8200}, periodSeconds: 5, failureThreshold: 3}
        livenessProbe: {httpGet: {path: /health, port: 8200}, periodSeconds: 10, failureThreshold: 3}
      volumes:
      - {name: dshm, emptyDir: {medium: Memory, sizeLimit: 96Gi}}
      - {name: torch-compile-cache, emptyDir: {}}
      - {name: triton-cache, emptyDir: {}}
      - {name: vllm-config, emptyDir: {}}
      - {name: gp2p, configMap: {name: combined-overlay-uc2resume}}
---
apiVersion: v1
kind: Service
metadata: {name: scenb-agg, namespace: nilig-p2p}
spec:
  selector: {app: scenb-agg}
  ports:
  - {name: proxy, port: 8000, targetPort: 8000}
  - {name: kv-events, port: 5556, targetPort: 5556}
