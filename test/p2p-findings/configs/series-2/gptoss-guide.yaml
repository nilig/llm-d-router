endpoint:
  stack_name: gptoss-guide
  model: openai/gpt-oss-120b
  namespace: nilig-p2p
  base_url: http://llm-d-router-epp.nilig-p2p.svc.cluster.local:8081
  hf_token_secret: llm-d-hf-token
control:
  work_dir: /private/tmp/claude-501/-Users-niliguy-github-com-llm-d-router/a5536e3c-535b-499e-b9eb-5ba4d86c97ae/scratchpad/bench-work
  kubectl: kubectl
harness:
  name: inference-perf
  results_pvc: workload-pvc
  namespace: nilig-p2p
  parallelism: 1
  wait_timeout: 5400
  image: ghcr.io/llm-d/llm-d-benchmark:v0.7.0
env:
- name: RAYON_NUM_THREADS
  value: '4'
workload:
  gptoss_guide:
    # llm-d-benchmark workload/profiles/inference-perf/guide_precise-prefix-cache-routing_1.yaml
    # verbatim except model_name/base_url/tokenizer (Qwen3-32B -> gpt-oss-120b, our EPP endpoint).
    load:
      type: poisson
      interval: 30.0
      stages:
      # Warmup - seat residents (~1xS)
      - rate: 15
        duration: 50
      # Main ladder
      - rate: 3
        duration: 20
      - rate: 10
        duration: 20
      - rate: 15
        duration: 20
      - rate: 20
        duration: 38
      - rate: 22
        duration: 34
      - rate: 25
        duration: 30
      - rate: 30
        duration: 25
      - rate: 35
        duration: 21
      - rate: 40
        duration: 38
      - rate: 43
        duration: 36
      - rate: 46
        duration: 33
      - rate: 49
        duration: 30
      - rate: 52
        duration: 29
      - rate: 55
        duration: 27
      - rate: 57
        duration: 26
      - rate: 60
        duration: 25
    api:
      type: completion
      streaming: true
    server:
      type: vllm
      model_name: openai/gpt-oss-120b
      base_url: http://llm-d-router-epp.nilig-p2p.svc.cluster.local:8081
      ignore_eos: true
    tokenizer:
      pretrained_model_name_or_path: openai/gpt-oss-120b
    data:
      type: shared_prefix
      shared_prefix:
        num_groups: 150
        num_prompts_per_group: 5
        system_prompt_len: 6000
        question_len: 1200
        output_len: 1000
        enable_multi_turn_chat: false
    report:
      request_lifecycle:
        summary: true
        per_stage: true
        per_request: true
    storage:
      local_storage:
        path: /workspace
