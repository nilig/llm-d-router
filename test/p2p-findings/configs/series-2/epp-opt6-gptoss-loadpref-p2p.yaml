apiVersion: llm-d.ai/v1alpha1
kind: EndpointPickerConfig
# OPT 6 (aggregated, load-preferred + p2p): placement prefers load, prefix is a
# weak tie-break (queue 3 / kv-util 2 / prefix 1, weighted-random picker), and
# the p2p-source-producer covers the misses that spreading creates - source is
# the max-cached peer, ties sampled by inverse waiting-queue (#2032 image).
# Producer config identical to the opt4v baseline (blockSize 64, speculative on).
plugins:
- type: token-producer
  parameters:
    modelName: openai/gpt-oss-120b
    vllm:
      url: http://gptoss-render:8000
- type: endpoint-notification-source
- type: metrics-data-source
  parameters: {scheme: "http", path: "/metrics", insecureSkipVerify: true}
- type: core-metrics-extractor
- type: precise-prefix-cache-producer
  parameters:
    tokenProcessorConfig:
      blockSize: 64
    speculativeIndexing: true
    kvEventsConfig:
      topicFilter: "kv@"
      discoverPods: true
      podDiscoveryConfig:
        socketPort: 5556
- type: prefix-cache-scorer
  parameters:
    prefixMatchInfoProducerName: precise-prefix-cache-producer
- type: p2p-source-producer
  parameters:
    prefixMatchInfoProducerName: precise-prefix-cache-producer
    prefillProfileName: default
    minCachedTokenDelta: 2048
- type: queue-scorer
- type: kv-cache-utilization-scorer
- type: weighted-random-picker
- type: single-profile-handler
dataLayer:
  sources:
  - pluginRef: metrics-data-source
    extractors:
    - pluginRef: core-metrics-extractor
  - pluginRef: endpoint-notification-source
    extractors:
    - pluginRef: precise-prefix-cache-producer
schedulingProfiles:
- name: default
  plugins:
  - pluginRef: weighted-random-picker
  - pluginRef: queue-scorer
    weight: 3
  - pluginRef: kv-cache-utilization-scorer
    weight: 2
  - pluginRef: prefix-cache-scorer
    weight: 1
