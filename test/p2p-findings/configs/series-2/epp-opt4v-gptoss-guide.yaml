apiVersion: llm-d.ai/v1alpha1
kind: EndpointPickerConfig
# OPT 4V (aggregated, guide-verbatim baseline): the precise-prefix-cache-routing
# guide's shipped scheduling config, complete - prefix 3 / queue 2 / kv-util 2 /
# no-hit-lru 2, max-score picker, speculativeIndexing on. Differs from series-1
# opt4 by including no-hit-lru-scorer and speculativeIndexing, as the guide ships.
plugins:
- type: token-producer
  parameters:
    modelName: openai/gpt-oss-120b
    vllm:
      url: http://gptoss-render:8000
- type: endpoint-notification-source
- type: metrics-data-source
  parameters: {scheme: "http", path: "/metrics", insecureSkipVerify: true}
- type: core-metrics-extractor
- type: precise-prefix-cache-producer
  parameters:
    tokenProcessorConfig:
      blockSize: 64
    speculativeIndexing: true
    kvEventsConfig:
      topicFilter: "kv@"
      discoverPods: true
      podDiscoveryConfig:
        socketPort: 5556
- type: prefix-cache-scorer
  parameters:
    prefixMatchInfoProducerName: precise-prefix-cache-producer
- type: no-hit-lru-scorer
  parameters:
    prefixMatchInfoProducerName: precise-prefix-cache-producer
- type: queue-scorer
- type: kv-cache-utilization-scorer
- type: max-score-picker
- type: single-profile-handler
dataLayer:
  sources:
  - pluginRef: metrics-data-source
    extractors:
    - pluginRef: core-metrics-extractor
  - pluginRef: endpoint-notification-source
    extractors:
    - pluginRef: precise-prefix-cache-producer
schedulingProfiles:
- name: default
  plugins:
  - pluginRef: max-score-picker
  - pluginRef: prefix-cache-scorer
    weight: 3
  - pluginRef: queue-scorer
    weight: 2
  - pluginRef: kv-cache-utilization-scorer
    weight: 2
  - pluginRef: no-hit-lru-scorer
    weight: 2
