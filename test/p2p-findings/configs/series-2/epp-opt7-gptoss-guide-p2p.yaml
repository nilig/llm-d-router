apiVersion: llm-d.ai/v1alpha1
kind: EndpointPickerConfig
# OPT 7 (aggregated, guide-verbatim + p2p): the precise guide's shipped
# scheduling config exactly as in opt4v - prefix 3 / queue 2 / kv-util 2 /
# no-hit-lru 2, max-score picker, speculativeIndexing on - plus ONLY the
# p2p-source-producer (delta 2048, load-aware source ties). Placement is
# identical to the baseline; the producer activates only when scheduling
# diverges from the best cache holder. Tests the "adding P2P to the guide
# is same-or-better" claim.
plugins:
- type: token-producer
  parameters:
    modelName: openai/gpt-oss-120b
    vllm:
      url: http://gptoss-render:8000
- type: endpoint-notification-source
- type: metrics-data-source
  parameters: {scheme: "http", path: "/metrics", insecureSkipVerify: true}
- type: core-metrics-extractor
- type: precise-prefix-cache-producer
  parameters:
    tokenProcessorConfig:
      blockSize: 64
    speculativeIndexing: true
    kvEventsConfig:
      topicFilter: "kv@"
      discoverPods: true
      podDiscoveryConfig:
        socketPort: 5556
- type: prefix-cache-scorer
  parameters:
    prefixMatchInfoProducerName: precise-prefix-cache-producer
- type: no-hit-lru-scorer
  parameters:
    prefixMatchInfoProducerName: precise-prefix-cache-producer
- type: p2p-source-producer
  parameters:
    prefixMatchInfoProducerName: precise-prefix-cache-producer
    prefillProfileName: default
    minCachedTokenDelta: 2048
- type: queue-scorer
- type: kv-cache-utilization-scorer
- type: max-score-picker
- type: single-profile-handler
dataLayer:
  sources:
  - pluginRef: metrics-data-source
    extractors:
    - pluginRef: core-metrics-extractor
  - pluginRef: endpoint-notification-source
    extractors:
    - pluginRef: precise-prefix-cache-producer
schedulingProfiles:
- name: default
  plugins:
  - pluginRef: max-score-picker
  - pluginRef: prefix-cache-scorer
    weight: 3
  - pluginRef: queue-scorer
    weight: 2
  - pluginRef: kv-cache-utilization-scorer
    weight: 2
  - pluginRef: no-hit-lru-scorer
    weight: 2
