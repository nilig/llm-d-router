apiVersion: v1
kind: ConfigMap
metadata:
  name: agentx-slo-arms
  namespace: nilig-agentx-slo
data:
  # Verbatim from ecrncevi-dev/wide-ep-lws-epp-token-{precise,precise-p2p},
  # the pair Maroon's real-fork result was measured on. They differ by exactly
  # the five p2p-source-producer lines, so the pull is the only variable.
  #
  # NOT derived from the approximate index: the weka campaign's 8-cell matrix
  # showed approximate + P2P fires zero pulls, because lruCapacityPerServer
  # 200000 models a real ~7,700-block tier as still holding what it evicted.

  p2p-off.yaml: |
    apiVersion: llm-d.ai/v1alpha1
    kind: EndpointPickerConfig
    plugins:
    - type: disagg-headers-handler
    - type: always-disagg-pd-decider
    - type: disagg-profile-handler
      parameters:
        deciderPluginName: always-disagg-pd-decider
    - type: prefill-filter
    - type: decode-filter
    - type: token-producer
      parameters:
        modelName: zai-org/GLM-5.2-FP8
        vllm:
          url: http://glm-5-2-render:8000
    - type: endpoint-notification-source
    - type: precise-prefix-cache-producer
      parameters:
        indexerConfig:
          kvBlockIndexConfig:
            inMemoryConfig:
              podCacheSize: 128
        tokenProcessorConfig:
          blockSize: 64
        kvEventsConfig:
          topicFilter: "kv@"
          discoverPods: true
          podDiscoveryConfig:
            socketPort: 5557
    - type: inflight-load-producer
      parameters:
        prefixMatchInfoProducerName: precise-prefix-cache-producer
    - type: prefix-cache-affinity-filter
      parameters:
        prefixMatchInfoProducerName: precise-prefix-cache-producer
        inFlightLoadProducerName: inflight-load-producer
        peakPrefillThroughput: 3585
    - type: token-load-scorer
    - type: active-request-scorer
    - type: max-score-picker
    dataLayer:
      sources:
      - pluginRef: endpoint-notification-source
        extractors:
        - pluginRef: precise-prefix-cache-producer
    schedulingProfiles:
    - name: prefill
      plugins:
      - pluginRef: prefill-filter
      - pluginRef: prefix-cache-affinity-filter
      - pluginRef: token-load-scorer
      - pluginRef: max-score-picker
    - name: decode
      plugins:
      - pluginRef: decode-filter
      - pluginRef: active-request-scorer
      - pluginRef: max-score-picker

  p2p-on.yaml: |
    apiVersion: llm-d.ai/v1alpha1
    kind: EndpointPickerConfig
    plugins:
    - type: disagg-headers-handler
    - type: always-disagg-pd-decider
    - type: disagg-profile-handler
      parameters:
        deciderPluginName: always-disagg-pd-decider
    - type: prefill-filter
    - type: decode-filter
    - type: token-producer
      parameters:
        modelName: zai-org/GLM-5.2-FP8
        vllm:
          url: http://glm-5-2-render:8000
    - type: endpoint-notification-source
    - type: precise-prefix-cache-producer
      parameters:
        indexerConfig:
          kvBlockIndexConfig:
            inMemoryConfig:
              podCacheSize: 128
        tokenProcessorConfig:
          blockSize: 64
        kvEventsConfig:
          topicFilter: "kv@"
          discoverPods: true
          podDiscoveryConfig:
            socketPort: 5557
    - type: inflight-load-producer
      parameters:
        prefixMatchInfoProducerName: precise-prefix-cache-producer
    - type: prefix-cache-affinity-filter
      parameters:
        prefixMatchInfoProducerName: precise-prefix-cache-producer
        inFlightLoadProducerName: inflight-load-producer
        peakPrefillThroughput: 3585
    - type: p2p-source-producer
      parameters:
        prefixMatchInfoProducerName: precise-prefix-cache-producer
        prefillProfileName: prefill
        minCachedTokenDelta: 12288
    - type: token-load-scorer
    - type: active-request-scorer
    - type: max-score-picker
    dataLayer:
      sources:
      - pluginRef: endpoint-notification-source
        extractors:
        - pluginRef: precise-prefix-cache-producer
    schedulingProfiles:
    - name: prefill
      plugins:
      - pluginRef: prefill-filter
      - pluginRef: prefix-cache-affinity-filter
      - pluginRef: token-load-scorer
      - pluginRef: max-score-picker
    - name: decode
      plugins:
      - pluginRef: decode-filter
      - pluginRef: active-request-scorer
      - pluginRef: max-score-picker

