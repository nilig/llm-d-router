apiVersion: v1
kind: ConfigMap
metadata:
  name: agentx-slo-arms
  namespace: nilig-agentx-slo
data:
  # Verbatim from nilig-p2p/p2p-weka-epp-plugins blog-precise{,-p2p}.yaml -- the
  # weka campaign pair with measured engagement (4.1% at c64). Only the render
  # service name is changed for this namespace.
  #
  # Replaces an earlier reconstruction from ecrncevi-dev token-precise{,-p2p},
  # which fired zero pulls: it omitted metrics-data-source/core-metrics-extractor,
  # so candidate endpoints carry no metrics metadata and the load-aware source
  # selection has nothing to choose from.

  p2p-off.yaml: |
    apiVersion: llm-d.ai/v1alpha1
    kind: EndpointPickerConfig
    plugins:
    - type: disagg-headers-handler
    - type: always-disagg-pd-decider
    - type: disagg-profile-handler
      parameters:
        deciderPluginName: always-disagg-pd-decider
    - type: prefill-filter
    - type: decode-filter
    - type: token-producer
      parameters:
        modelName: zai-org/GLM-5.2-FP8
        vllm:
          url: http://glm-5-2-render:8000
    - type: endpoint-notification-source
    - type: metrics-data-source
      parameters:
        scheme: http
        path: /metrics
        insecureSkipVerify: true
    - type: core-metrics-extractor
    - type: precise-prefix-cache-producer
      parameters:
        indexerConfig:
          kvBlockIndexConfig:
            inMemoryConfig:
              podCacheSize: 64
          kvCacheBackendConfigs:
          - name: gpu
            weight: 1.0
          - name: cpu
            weight: 0.4
        tokenProcessorConfig:
          blockSize: 64
        kvEventsConfig:
          topicFilter: "kv@"
          discoverPods: true
          podDiscoveryConfig:
            socketPort: 5557
    - type: prefix-cache-scorer
      name: blog-tier-weighted-prefix-cache-scorer
      parameters:
        prefixMatchInfoProducerName: precise-prefix-cache-producer
    - type: queue-scorer
    - type: active-request-scorer
    dataLayer:
      sources:
      - pluginRef: metrics-data-source
        extractors:
        - pluginRef: core-metrics-extractor
      - pluginRef: endpoint-notification-source
        extractors:
        - pluginRef: precise-prefix-cache-producer
    schedulingProfiles:
    - name: prefill
      plugins:
      - pluginRef: prefill-filter
      - pluginRef: blog-tier-weighted-prefix-cache-scorer
        weight: 5
      - pluginRef: active-request-scorer
        weight: 1
    - name: decode
      plugins:
      - pluginRef: decode-filter
      - pluginRef: active-request-scorer
        weight: 3

  p2p-on.yaml: |
    apiVersion: llm-d.ai/v1alpha1
    kind: EndpointPickerConfig
    plugins:
    - type: disagg-headers-handler
    - type: always-disagg-pd-decider
    - type: disagg-profile-handler
      parameters:
        deciderPluginName: always-disagg-pd-decider
    - type: prefill-filter
    - type: decode-filter
    - type: token-producer
      parameters:
        modelName: zai-org/GLM-5.2-FP8
        vllm:
          url: http://glm-5-2-render:8000
    - type: endpoint-notification-source
    - type: metrics-data-source
      parameters:
        scheme: http
        path: /metrics
        insecureSkipVerify: true
    - type: core-metrics-extractor
    - type: precise-prefix-cache-producer
      parameters:
        indexerConfig:
          kvBlockIndexConfig:
            inMemoryConfig:
              podCacheSize: 64
          kvCacheBackendConfigs:
          - name: gpu
            weight: 1.0
          - name: cpu
            weight: 0.4
        tokenProcessorConfig:
          blockSize: 64
        kvEventsConfig:
          topicFilter: "kv@"
          discoverPods: true
          podDiscoveryConfig:
            socketPort: 5557
    - type: prefix-cache-scorer
      name: blog-tier-weighted-prefix-cache-scorer
      parameters:
        prefixMatchInfoProducerName: precise-prefix-cache-producer
    - type: p2p-source-producer
      parameters:
        prefixMatchInfoProducerName: precise-prefix-cache-producer
        prefillProfileName: prefill
        minCachedTokenDelta: 12288
    - type: queue-scorer
    - type: active-request-scorer
    dataLayer:
      sources:
      - pluginRef: metrics-data-source
        extractors:
        - pluginRef: core-metrics-extractor
      - pluginRef: endpoint-notification-source
        extractors:
        - pluginRef: precise-prefix-cache-producer
    schedulingProfiles:
    - name: prefill
      plugins:
      - pluginRef: prefill-filter
      - pluginRef: blog-tier-weighted-prefix-cache-scorer
        weight: 5
      - pluginRef: active-request-scorer
        weight: 1
    - name: decode
      plugins:
      - pluginRef: decode-filter
      - pluginRef: active-request-scorer
        weight: 3

  # spill-off/spill-on: verbatim from ecrncevi-dev token-precise{,-p2p} -- the
  # pair the real-fork result was measured with. Unlike blog-precise, this pair
  # can SPILL: prefix-cache-affinity-filter models the holder as busy for
  # tokens/peakPrefillThroughput seconds, so a sibling arriving during the
  # seed's ~21s modeled window is placed on a cold rank and the p2p producer
  # sets the source header. blog-precise scores affinity against an actual
  # (empty) queue and never spills at low load -- 3,088 evaluations, delta 0.

  spill-off.yaml: |
    apiVersion: llm-d.ai/v1alpha1
    kind: EndpointPickerConfig
    plugins:
    - type: disagg-headers-handler
    - type: always-disagg-pd-decider
    - type: disagg-profile-handler
      parameters:
        deciderPluginName: always-disagg-pd-decider
    - type: prefill-filter
    - type: decode-filter
    - type: token-producer
      parameters:
        modelName: zai-org/GLM-5.2-FP8
        vllm:
          url: http://glm-5-2-render:8000
    - type: endpoint-notification-source
    - type: precise-prefix-cache-producer
      parameters:
        indexerConfig:
          kvBlockIndexConfig:
            inMemoryConfig:
              podCacheSize: 128
          kvCacheBackendConfigs:
          - name: gpu
            weight: 1.0
          - name: cpu
            weight: 0.4
        tokenProcessorConfig:
          blockSize: 64
        kvEventsConfig:
          topicFilter: "kv@"
          discoverPods: true
          podDiscoveryConfig:
            socketPort: 5557
    - type: inflight-load-producer
      parameters:
        prefixMatchInfoProducerName: precise-prefix-cache-producer
    - type: prefix-cache-affinity-filter
      parameters:
        prefixMatchInfoProducerName: precise-prefix-cache-producer
        inFlightLoadProducerName: inflight-load-producer
        peakPrefillThroughput: 3585
    - type: token-load-scorer
    - type: active-request-scorer
    - type: max-score-picker
    dataLayer:
      sources:
      - pluginRef: endpoint-notification-source
        extractors:
        - pluginRef: precise-prefix-cache-producer
    schedulingProfiles:
    - name: prefill
      plugins:
      - pluginRef: prefill-filter
      - pluginRef: prefix-cache-affinity-filter
      - pluginRef: token-load-scorer
      - pluginRef: max-score-picker
    - name: decode
      plugins:
      - pluginRef: decode-filter
      - pluginRef: active-request-scorer
      - pluginRef: max-score-picker

  spill-on.yaml: |
    apiVersion: llm-d.ai/v1alpha1
    kind: EndpointPickerConfig
    plugins:
    - type: disagg-headers-handler
    - type: always-disagg-pd-decider
    - type: disagg-profile-handler
      parameters:
        deciderPluginName: always-disagg-pd-decider
    - type: prefill-filter
    - type: decode-filter
    - type: token-producer
      parameters:
        modelName: zai-org/GLM-5.2-FP8
        vllm:
          url: http://glm-5-2-render:8000
    - type: endpoint-notification-source
    - type: precise-prefix-cache-producer
      parameters:
        indexerConfig:
          kvBlockIndexConfig:
            inMemoryConfig:
              podCacheSize: 128
          kvCacheBackendConfigs:
          - name: gpu
            weight: 1.0
          - name: cpu
            weight: 0.4
        tokenProcessorConfig:
          blockSize: 64
        kvEventsConfig:
          topicFilter: "kv@"
          discoverPods: true
          podDiscoveryConfig:
            socketPort: 5557
    - type: inflight-load-producer
      parameters:
        prefixMatchInfoProducerName: precise-prefix-cache-producer
    - type: prefix-cache-affinity-filter
      parameters:
        prefixMatchInfoProducerName: precise-prefix-cache-producer
        inFlightLoadProducerName: inflight-load-producer
        peakPrefillThroughput: 3585
    - type: p2p-source-producer
      parameters:
        prefixMatchInfoProducerName: precise-prefix-cache-producer
        prefillProfileName: prefill
        minCachedTokenDelta: 12288
    - type: token-load-scorer
    - type: active-request-scorer
    - type: max-score-picker
    dataLayer:
      sources:
      - pluginRef: endpoint-notification-source
        extractors:
        - pluginRef: precise-prefix-cache-producer
    schedulingProfiles:
    - name: prefill
      plugins:
      - pluginRef: prefill-filter
      - pluginRef: prefix-cache-affinity-filter
      - pluginRef: token-load-scorer
      - pluginRef: max-score-picker
    - name: decode
      plugins:
      - pluginRef: decode-filter
      - pluginRef: active-request-scorer
      - pluginRef: max-score-picker
