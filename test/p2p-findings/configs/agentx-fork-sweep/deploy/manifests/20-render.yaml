apiVersion: v1
kind: Service
metadata:
  name: glm-5-2-render
  namespace: nilig-agentx-slo
spec:
  # This Service owns no pods: it fronts the prefill model servers, which
  # already expose vLLM's /v1/*/render endpoints, so the EPP token-producer
  # tokenizes on the serving fleet and render capacity scales with it
  # (llm-d/llm-d#2188). Prefill pods are selected rather than decode because
  # the decode pods' port 8000 belongs to the routing-proxy sidecar, not vLLM.
  # Only Ready endpoints receive traffic, so render calls never reach a pod
  # still loading weights - but until the first prefill is Ready the Service
  # has no endpoints and token-producer calls fail.
  selector:
    llm-d.ai/model: GLM-5.2-FP8
    llm-d.ai/role: prefill
  ports:
  - name: http
    port: 8000
    protocol: TCP
    targetPort: 8000
