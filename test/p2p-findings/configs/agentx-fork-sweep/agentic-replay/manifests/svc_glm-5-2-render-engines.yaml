apiVersion: v1
kind: Service
metadata:
  name: glm-5-2-render-engines
  namespace: maroon-precise-kv
spec:
  clusterIP: 10.16.3.9
  clusterIPs:
  - 10.16.3.9
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: http
    port: 8000
    protocol: TCP
    targetPort: 8000
  selector:
    llm-d.ai/model: GLM-5.2-FP8
    llm-d.ai/role: prefill
  sessionAffinity: None
  type: ClusterIP

