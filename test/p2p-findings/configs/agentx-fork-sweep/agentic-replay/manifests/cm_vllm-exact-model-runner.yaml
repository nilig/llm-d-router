    \ migrate recurrent state across block\n            # boundaries before the forward. Runs only on real batches, and\n            # before model_state.prepare_attn gathers num_accepted_tokens so the\n\
    \            # boundary reset is visible to the attention metadata.\n            self.model_state.preprocess_state(\n                input_batch,\n                block_tables,\n                self.kv_cache_config,\n\
    \                self.req_states.num_computed_tokens.gpu,\n            )\n\n            if self.lora_config:\n                # Activate LoRA adapters.\n                lora_inputs = self.lora_state.make_lora_inputs(\n\
    \                    input_batch.req_ids,\n                    input_batch.idx_mapping_np,\n                    input_batch.num_scheduled_tokens,\n                )\n                self._set_active_loras(*lora_inputs)\n\
    \        else:\n            # No actual tokens to run. A dummy run for DP or memory profiling.\n            input_batch = InputBatch.make_dummy(\n                batch_desc.num_reqs or num_reqs,\n \
    \               batch_desc.num_tokens,\n                self.input_buffers,\n            )\n            if not skip_attn_for_dummy_run:\n                block_tables, slot_mappings = self.prepare_dummy_attn(input_batch)\n\
    \            else:\n                assert batch_desc.cg_mode != CUDAGraphMode.FULL, (\n                    \"Attention metadata must be prepared for dummy runs when using \"\n                    \"\
    FULL cudagraph mode.\"\n                )\n                block_tables = None\n                slot_mappings = None\n\n        attn_metadata = None\n        slot_mappings_by_layer = None\n        if\
    \ not (dummy_run and skip_attn_for_dummy_run):\n            assert slot_mappings is not None\n            slot_mappings_by_layer = build_slot_mappings_by_layer(\n                slot_mappings, self.kv_cache_config\n\
    \            )\n            assert block_tables is not None\n            attn_metadata = self.model_state.prepare_attn(\n                input_batch,\n                batch_desc.cg_mode,\n         \
    \       block_tables,\n                slot_mappings,\n                self.attn_groups,\n                self.kv_cache_config,\n                # FULL replay reads capture-time metadata buffers. Re-stage\
    \ them\n                # from the zeroed dummy block tables instead of retaining state\n                # indices from the previous real batch.\n                for_capture=dummy_run and batch_desc.cg_mode\
    \ == CUDAGraphMode.FULL,\n            )\n\n        input_ids = input_batch.input_ids\n        inputs_embeds = None\n        if self.supports_mm_inputs and self.is_first_pp_rank:\n            # Run MM\
    \ encoder (if needed) and get multimodal embeddings.\n            # Only first PP rank prepares multimodal embeddings.\n            if dummy_run:\n                # Obtain mm embeddings of correct shape\
    \ for compiled model.\n                inputs_embeds = self.model_state.dummy_inputs_embeds(\n                    input_batch.num_tokens_after_padding\n                )\n            else:\n       \
    \         scheduled_encoder_inputs = scheduler_output.scheduled_encoder_inputs\n                if self.lora_config is not None:\n                    set_active_mm_loras(\n                        model=self.model,\n\
    \                        lora_manager=self.lora_manager,\n                        encoder_cache=self.encoder_cache,\n                        req_id_to_index=self.req_states.req_id_to_index,\n      \
    \                  lora_state=self.lora_state,\n                        scheduled_encoder_inputs=scheduled_encoder_inputs,\n                    )\n                inputs_embeds = self.model_state.get_mm_embeddings(\n\
    \                    scheduled_encoder_inputs, input_batch, self.req_states\n                )\n            if inputs_embeds is not None and not self.model.requires_raw_input_tokens:\n             \
    \   input_ids = None\n\n        model_inputs = {\n            \"input_ids\": input_ids,\n            \"positions\": input_batch.positions,\n            \"inputs_embeds\": inputs_embeds,\n          \
    \  \"intermediate_tensors\": None,\n            # NOTE: Values returned by `prepare_inputs` will override the default\n            # values above.\n            **self.model_state.prepare_inputs(input_batch,\
    \ self.req_states),\n        }\n        if not self.is_first_pp_rank:\n            # Update for non-first PP ranks.\n            model_inputs[\"input_ids\"] = None\n            model_inputs[\"inputs_embeds\"\
    ] = None\n\n            # Prepare the intermediate tensors.\n            assert intermediate_tensors is not None\n            assert self.intermediate_tensors is not None\n            n = input_batch.num_tokens_after_padding\n\
    \            new_tensors = {\n                k: v[:n]\n                if dummy_run\n                else v[:n].copy_(intermediate_tensors.tensors[k][:n])\n                for k, v in self.intermediate_tensors.tensors.items()\n\
    \            }\n            model_inputs[\"intermediate_tensors\"] = IntermediateTensors(new_tensors)\n            del intermediate_tensors\n\n        # Update the EPLB meta.\n        self.eplb.prepare_forward(self.model_config,\
    \ input_batch.num_tokens)\n\n        # Run model.\n        if batch_desc.cg_mode == CUDAGraphMode.FULL:\n            # Use explicit cudagraph replay for FULL mode.\n            # NOTE(woosuk): Here,\
    \ we don't need to pass the input tensors,\n            # because they are already copied to the CUDA graph input buffers.\n            assert self.cudagraph_manager is not None\n            self.kv_connector.pre_forward(scheduler_output)\n\
    \            model_output = self.cudagraph_manager.run_fullgraph(batch_desc)\n        else:\n            # For piecewise and eager mode, just call model().\n            batch_descriptor = BatchDescriptor(\n\
    \                num_tokens=input_batch.num_tokens_after_padding,\n                has_lora=self.lora_config is not None,\n                num_active_loras=batch_desc.num_active_loras,\n           \
    \ )\n\n            with set_forward_context(\n                attn_metadata,\n                self.vllm_config,\n                num_tokens=input_batch.num_tokens_after_padding,\n                cudagraph_runtime_mode=batch_desc.cg_mode,\n\
