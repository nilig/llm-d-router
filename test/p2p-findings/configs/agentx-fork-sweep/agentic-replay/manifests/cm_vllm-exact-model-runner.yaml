  model_runner.py: "# SPDX-License-Identifier: Apache-2.0\n# SPDX-FileCopyrightText: Copyright contributors to the vLLM project\n\"\"\"\nNOTE: Coding style guide for this file:\nThis model runner is shared\
    \ by all models: text and multimodal, generative\nand embedding, public and private. As a result, this file must only contain\ncode that is common to every model. Model-specific behavior belongs in\
    \ the\nappropriate model-specific files.\n\nIn other words:\n* Be paranoid about changing this file. It should remain stable.\n* Be even more paranoid about adding new lines. It should remain minimal.\n\
    \nEven for shared features (for example, different parallelism modes), keep the\ncomplexity out of this path. The less common the feature, the more it should be\nhidden. Prefer utility functions defined\
    \ elsewhere and call them from here,\ninstead of embedding feature-specific logic directly.\n\"\"\"\n\nimport functools\nimport gc\nimport time\nfrom copy import deepcopy\nfrom typing import Any, NamedTuple\n\
    \nimport numpy as np\nimport torch\nimport torch.nn as nn\n\nimport vllm.envs as envs\nfrom vllm.compilation.counter import compilation_counter\nfrom vllm.config import VllmConfig\nfrom vllm.config.compilation\
    \ import CUDAGraphMode\nfrom vllm.distributed.parallel_state import (\n    get_dcp_group,\n    get_pp_group,\n    prepare_communication_buffer_for_model,\n)\nfrom vllm.forward_context import BatchDescriptor,\
    \ set_forward_context\nfrom vllm.logger import init_logger\nfrom vllm.model_executor.layers.fused_moe.all2all_utils import get_ep_all2all_manager\nfrom vllm.model_executor.layers.mamba.ops.ssu_dispatch\
    \ import (\n    initialize_mamba_ssu_backend,\n)\nfrom vllm.model_executor.model_loader import get_model_loader\nfrom vllm.multimodal import MULTIMODAL_REGISTRY\nfrom vllm.multimodal.encoder_budget\
    \ import (\n    MultiModalBudget,\n    get_dummy_encoder_profile_inputs,\n)\nfrom vllm.sequence import IntermediateTensors\nfrom vllm.tasks import SupportedTask\nfrom vllm.utils.math_utils import cdiv\n\
    from vllm.utils.mem_utils import DeviceMemoryProfiler, format_gib\nfrom vllm.utils.torch_utils import STR_DTYPE_TO_TORCH_DTYPE\nfrom vllm.v1.core.sched.output import GrammarOutput, SchedulerOutput\n\
    from vllm.v1.kv_cache_interface import KVCacheConfig, MambaSpec\nfrom vllm.v1.outputs import DraftTokenIds, ModelRunnerOutput\nfrom vllm.v1.worker.block_table import get_block_table_width\nfrom vllm.v1.worker.cp_utils\
    \ import check_attention_cp_compatibility\nfrom vllm.v1.worker.gpu import pcp_manager as pcp\nfrom vllm.v1.worker.gpu.async_utils import AsyncOutput, AsyncPoolingOutput\nfrom vllm.v1.worker.gpu.attn_utils\
    \ import (\n    build_slot_mappings_by_layer,\n    get_kv_cache_spec,\n    init_attn_backend,\n    init_kv_cache,\n)\nfrom vllm.v1.worker.gpu.block_table import BlockTables\nfrom vllm.v1.worker.gpu.buffer_utils\
    \ import (\n    async_copy_to_gpu,\n    set_default_max_concurrency,\n)\nfrom vllm.v1.worker.gpu.cp_utils import prepare_dcp_local_seq_lens\nfrom vllm.v1.worker.gpu.cudagraph_utils import (\n    BatchExecutionDescriptor,\n\
    \    ModelCudaGraphManager,\n    get_uniform_token_count,\n)\nfrom vllm.v1.worker.gpu.dp_utils import dispatch_cg_and_sync_dp\nfrom vllm.v1.worker.gpu.eplb_utils import EPLBController, step_eplb_after\n\
    from vllm.v1.worker.gpu.input_batch import (\n    InputBatch,\n    InputBuffers,\n    combine_sampled_and_draft_tokens,\n    expand_idx_mapping,\n    post_update,\n    post_update_num_computed_tokens,\n\
    \    prepare_pos_seq_lens,\n    prepare_prefill_inputs,\n)\nfrom vllm.v1.worker.gpu.kv_connector import (\n    NO_OP_KV_CONNECTOR,\n    KVConnector,\n    get_kv_connector,\n)\nfrom vllm.v1.worker.gpu.lora_utils\
    \ import (\n    LoraState,\n    create_lora_capture_hook,\n    get_lora_capture_cases,\n    get_num_active_loras_for_dispatch,\n)\nfrom vllm.v1.worker.gpu.mm.encoder_cache import EncoderCache\nfrom\
    \ vllm.v1.worker.gpu.mm.lora import set_active_mm_loras\nfrom vllm.v1.worker.gpu.model_states import init_model_state\nfrom vllm.v1.worker.gpu.pool.pooling_runner import PoolingRunner\nfrom vllm.v1.worker.gpu.pp_utils\
    \ import PPHandler\nfrom vllm.v1.worker.gpu.sample.output import SamplerOutput\nfrom vllm.v1.worker.gpu.sample.prompt_logprob import PromptLogprobsWorker\nfrom vllm.v1.worker.gpu.sample.sampler import\
    \ Sampler\nfrom vllm.v1.worker.gpu.shutdown import free_before_shutdown\nfrom vllm.v1.worker.gpu.spec_decode import init_speculator\nfrom vllm.v1.worker.gpu.spec_decode.eagle.eagle3_utils import (\n\
    \    set_eagle3_aux_hidden_state_layers,\n)\nfrom vllm.v1.worker.gpu.spec_decode.rejection_sampler import RejectionSampler\nfrom vllm.v1.worker.gpu.spec_decode.speculator import DraftModelSpeculator\n\
    from vllm.v1.worker.gpu.spec_decode.utils import DraftTokensHandler\nfrom vllm.v1.worker.gpu.states import RequestState\nfrom vllm.v1.worker.gpu.structured_outputs import StructuredOutputsWorker\nfrom\
    \ vllm.v1.worker.lora_model_runner_mixin import LoRAModelRunnerMixin\nfrom vllm.v1.worker.utils import KVBlockZeroer, copy_kv_cache_blocks_inplace\n\nlogger = init_logger(__name__)\n\n\nclass GPUModelRunner(LoRAModelRunnerMixin):\n\
    \    def __init__(self, vllm_config: VllmConfig, device: torch.device):\n        self.vllm_config = vllm_config\n        self.model_config = vllm_config.model_config\n        self.cache_config = vllm_config.cache_config\n\
    \        self.compilation_config = vllm_config.compilation_config\n        self.lora_config = vllm_config.lora_config\n        self.load_config = vllm_config.load_config\n        self.parallel_config\
    \ = vllm_config.parallel_config\n        self.scheduler_config = vllm_config.scheduler_config\n        self.speculative_config = vllm_config.speculative_config\n        self.observability_config = vllm_config.observability_config\n\
    \n        self.device = device\n        self.dtype = self.model_config.dtype\n        self.kv_cache_dtype = self.dtype\n        if self.cache_config.cache_dtype != \"auto\":\n            # Quantized\
    \ KV cache.\n            self.kv_cache_dtype = STR_DTYPE_TO_TORCH_DTYPE[\n                self.cache_config.cache_dtype\n            ]\n\n        # Lazily initialized in _init_kv_zero_meta() when the\
    \ KV cache needs\n        # zeroing (e.g. hybrid models with fp8 KV cache).\n        self.kv_block_zeroer: KVBlockZeroer | None = None\n\n        self.vocab_size = self.model_config.get_vocab_size()\n\
    \        self.max_model_len = self.model_config.max_model_len\n        self.max_num_tokens = self.scheduler_config.max_num_batched_tokens\n        self.max_num_reqs = self.scheduler_config.max_num_seqs\n\
    \        self.is_encoder_decoder = self.model_config.is_encoder_decoder\n\n        self.output_copy_stream = torch.cuda.Stream(self.device)\n\n        # Pipeline parallelism.\n        self.use_pp =\
    \ self.parallel_config.pipeline_parallel_size > 1\n        self.is_first_pp_rank = get_pp_group().is_first_rank\n        self.is_last_pp_rank = get_pp_group().is_last_rank\n\n        # Size the UVA\
    \ buffer pools to the max number of concurrent in-flight\n        # steps. Must run before any pooled buffer is constructed\n        set_default_max_concurrency(vllm_config.max_concurrent_batches)\n\
    \n        # PP broadcast/recv helper. Runs the collective on a side stream.\n        self.pp_handler: PPHandler | None = None\n\n        # Persistent buffer for intermediate tensors (non-first PP ranks).\n\
    \        self.intermediate_tensors: IntermediateTensors | None = None\n\n        # Data parallelism.\n        self.dp_size = self.parallel_config.data_parallel_size\n        self.dp_rank = self.parallel_config.data_parallel_rank\n\
    \n        # Detect EP all2all peer faults to prevent emitting corrupted output.\n        # Only meaningful for MoE + DP with an FT-capable all2all backend.\n        self.check_ep_fault = False\n   \
    \     if self.dp_size > 1 and self.model_config.is_moe:\n            self.check_ep_fault = get_ep_all2all_manager().support_fault_tolerance\n\n        # Decode context parallelism.\n        self.dcp_size\
    \ = self.parallel_config.decode_context_parallel_size\n        self.use_dcp = self.dcp_size > 1\n        self.dcp_rank = get_dcp_group().rank_in_group if self.use_dcp else 0\n        self.cp_interleave\
    \ = self.parallel_config.cp_kv_cache_interleave_size\n\n        # Multimodal\n        self.mm_registry = MULTIMODAL_REGISTRY\n        self.supports_mm_inputs = self.mm_registry.supports_multimodal_inputs(\n\
    \            self.model_config\n        )\n        self.encoder_cache = None\n        if self.supports_mm_inputs and self.is_first_pp_rank:\n            self.encoder_cache = EncoderCache()\n\n     \
    \   # Speculative decoding.\n        self.speculator = None\n        self.use_aux_hidden_state_outputs = False\n        self.num_speculative_steps = vllm_config.num_speculative_tokens\n        if self.speculative_config\
    \ is not None:\n            if self.is_last_pp_rank:\n                self.speculator = init_speculator(self.vllm_config, self.device)\n\n            if self.speculative_config.method in (\"eagle3\"\
    , \"dflash\", \"dspark\"):\n                # Drafting may require auxiliary hidden states from target model outputs\n                self.use_aux_hidden_state_outputs = True\n                if self.use_pp:\n\
    \                    raise ValueError(\n                        f\"{self.speculative_config.method} with pipeline parallel \"\n                        \"is not supported.\"\n                    )\n\n\
    \        # Draft tokens propagation - for spec-dec + struct outputs.\n        self.draft_tokens_handler = DraftTokensHandler(self.device)\n\n        self.pcp_manager: pcp.PCPManager | None = None\n\n\
    \        # Pooling models.\n        self.is_pooling_model = self.model_config.runner_type == \"pooling\"\n        self.pooling_runner: PoolingRunner | None = None\n\n        # General request states.\n\
    \        self.req_states = RequestState(\n            max_num_reqs=self.max_num_reqs,\n            max_model_len=self.max_model_len,\n            max_num_batched_tokens=self.max_num_tokens,\n      \
    \      num_speculative_steps=self.num_speculative_steps,\n            vocab_size=self.vocab_size,\n            device=self.device,\n        )\n        self.input_buffers = InputBuffers(\n          \
    \  max_num_reqs=self.max_num_reqs,\n            max_num_tokens=self.max_num_tokens,\n            device=self.device,\n        )\n        if self.use_pp:\n            self.pp_handler = PPHandler(\n \
    \               max_num_reqs=self.max_num_reqs,\n                num_speculative_steps=self.num_speculative_steps,\n                device=self.device,\n            )\n\n        # Samplers and decode_query_len\
    \ created in load_model() after\n        # model_state exists (num_new_sampled_tokens_per_step from ModelState).\n        self.sampler: Sampler | None = None\n        self.rejection_sampler: RejectionSampler\
    \ | None = None\n        self.prompt_logprobs_worker: PromptLogprobsWorker | None = None\n        self.structured_outputs_worker: StructuredOutputsWorker | None = None\n        self.cudagraph_manager:\
    \ ModelCudaGraphManager | None = None\n\n        # LoRA-related workers.\n        self.lora_state = LoraState(max_num_reqs=self.max_num_reqs)\n        self.lora_capture_cases = [0]\n        if self.lora_config:\n\
    \            self.lora_capture_cases = get_lora_capture_cases(\n                self.lora_config, self.compilation_config\n            )\n\n        # KV Connector if configured.\n        self.kv_connector:\
    \ KVConnector = NO_OP_KV_CONNECTOR\n\n        # For transferring state from execute_model to subsequent sample_tokens call.\n        self.execute_model_state: ExecuteModelState | None = None\n\n   \
    \     # Expert parallelism load balancer.\n        self.eplb = EPLBController(self.parallel_config, self.device)\n\n    def update_max_model_len(self, max_model_len: int) -> None:\n        self.max_model_len\
    \ = max_model_len\n        self.req_states.max_model_len = max_model_len\n\n    def get_supported_tasks(self) -> tuple[SupportedTask, ...]:\n        tasks: list[SupportedTask] = []\n        if self.model_config.runner_type\
    \ == \"generate\":\n            tasks.extend(self.model_state.get_supported_generation_tasks())\n        if self.is_pooling_model:\n            # Do not rely on pooling_runner here, since this information\
    \ is needed\n            # on the first PP rank, while pooling_runner is only initialized\n            # on the last PP rank.\n            tasks.extend(PoolingRunner.get_supported_tasks(self.model))\n\
    \        return tuple(tasks)\n\n    def load_model(self, load_dummy_weights: bool = False, *args, **kwargs) -> None:\n        time_before_load = time.perf_counter()\n        if load_dummy_weights:\n\
    \            self.load_config.load_format = \"dummy\"\n        self.eplb.prepare_load()\n        eplb_models_added = False\n        with DeviceMemoryProfiler() as m:\n            model_loader = get_model_loader(self.vllm_config.load_config)\n\
    \            logger.info(\"Loading model from scratch...\")\n\n            self.model = model_loader.load_model(\n                vllm_config=self.vllm_config, model_config=self.vllm_config.model_config\n\
    \            )\n            if self.lora_config:\n                self.model = self.load_lora_model(\n                    self.model, self.vllm_config, self.device\n                )\n\n           \
    \ if self.use_aux_hidden_state_outputs:\n                assert self.speculative_config is not None\n                set_eagle3_aux_hidden_state_layers(self.model, self.speculative_config)\n       \
    \     if isinstance(self.speculator, DraftModelSpeculator):\n                self.speculator.load_model(self.model)\n                eplb_models_added = self.eplb.maybe_register_speculator(\n      \
    \              self.speculator, self.speculative_config, load_dummy_weights\n                )\n        time_after_load = time.perf_counter()\n\n        self.model_memory_usage = m.consumed_memory\n\
    \        logger.info(\n            \"Model loading took %s GiB and %.6f seconds\",\n            format_gib(m.consumed_memory),\n            time_after_load - time_before_load,\n        )\n\n       \
    \ if not load_dummy_weights:\n            prepare_communication_buffer_for_model(self.model)\n            if self.speculator is not None:\n                prepare_communication_buffer_for_model(self.speculator.model)\n\
    \n        # Initialize the components that require the model.\n        self.model_state = init_model_state(\n            self.vllm_config, self.model, self.encoder_cache, self.device\n        )\n\n\
    \        self.decode_query_len = (\n            self.num_speculative_steps\n            + self.model_state.num_new_sampled_tokens_per_step\n        )\n\n        # Initialize samplers. Model states may\
    \ override via custom_sampler().\n        if self.is_last_pp_rank and not self.is_pooling_model:\n            self.sampler = Sampler(\n                max_num_reqs=self.max_num_reqs,\n             \
    \   vocab_size=self.vocab_size,\n                device=self.device,\n                req_states=self.req_states,\n                logprobs_mode=self.model_config.logprobs_mode,\n                num_speculative_tokens=self.decode_query_len,\n\
    \                use_fp64_gumbel=self.model_config.use_fp64_gumbel,\n            )\n            custom = self.model_state.custom_sampler(self.sampler)\n\n            if custom:\n                self.sampler,\
    \ self.rejection_sampler = custom\n            elif self.speculative_config is not None:\n                self.rejection_sampler = RejectionSampler(\n                    self.sampler,\n            \
    \        self.speculative_config,\n                    self.device,\n                )\n            self.prompt_logprobs_worker = PromptLogprobsWorker(\n                self.max_num_reqs,\n        \
    \        logprobs_mode=self.model_config.logprobs_mode,\n            )\n            self.structured_outputs_worker = StructuredOutputsWorker(\n                max_num_logits=self.max_num_reqs * self.decode_query_len,\n\
    \                vocab_size=self.vocab_size,\n                device=self.device,\n            )\n\n        if self.is_pooling_model and self.is_last_pp_rank:\n            self.pooling_runner = PoolingRunner(self.model)\n\
    \        eplb_models_added |= self.eplb.maybe_register_model(\n            self.model,\n            self.model_config,\n            load_dummy_weights,\n        )\n        self.eplb.maybe_start_async_loop(eplb_models_added)\n\
    \n        if not self.is_first_pp_rank:\n            # For non-first PP ranks, create intermediate tensors sized\n            # for the max capture size so they can be sliced per batch.\n          \
    \  # Save as persistent member so runtime can copy received data\n            # into the same addresses that the CUDA graphs captured.\n            self.intermediate_tensors = self.model.make_empty_intermediate_tensors(\n\
    \                batch_size=self.max_num_tokens,\n                dtype=self.model_config.dtype,\n                device=self.device,\n            )\n\n    def get_model(self) -> nn.Module:\n      \
    \  return self.model\n\n    def get_draft_model(self) -> nn.Module | None:\n        speculator = self.speculator\n        if not isinstance(speculator, DraftModelSpeculator):\n            return None\n\
    \        return speculator.model\n\n    def reload_weights(self, *args, **kwargs) -> None:\n        # TODO(Wentao): Use full version instead of import when fully migrated to v2\n        from vllm.v1.worker.gpu_model_runner\
    \ import GPUModelRunner as GPUModelRunnerV1\n\n        GPUModelRunnerV1.reload_weights(self, *args, **kwargs)  # type: ignore[arg-type]\n\n    def update_config(self, *args, **kwargs) -> None:\n   \
    \     # TODO(Wentao): Use full version instead of import when fully migrated to v2\n        from vllm.v1.worker.gpu_model_runner import GPUModelRunner as GPUModelRunnerV1\n\n        GPUModelRunnerV1.update_config(self,\
    \ *args, **kwargs)  # type: ignore[arg-type]\n\n        # v2 reads config via self.vllm_config (e.g. in load_model), so keep it\n        # in sync with the attributes the v1 helper just replaced.\n\
    \        self.vllm_config.model_config = self.model_config\n        self.vllm_config.load_config = self.load_config\n\n    @functools.cached_property\n    def main_stream(self) -> torch.cuda.Stream:\n\
    \        # Cache the default CUDA stream to avoid lookup overhead.\n        return torch.cuda.current_stream(self.device)\n\n    def get_kv_cache_spec(self):\n        return get_kv_cache_spec(self.vllm_config)\n\
    \n    def initialize_kv_cache(self, kv_cache_config: KVCacheConfig) -> None:\n        kv_cache_config = deepcopy(kv_cache_config)\n        self.kv_cache_config = kv_cache_config\n\n        block_table_max_model_len\
    \ = self.max_model_len\n        if self.is_encoder_decoder:\n            # Cross-attention block tables need to index encoder tokens, which\n            # can exceed the decoder's max_model_len.\n \
    \           block_table_max_model_len = max(\n                block_table_max_model_len,\n                self.scheduler_config.max_num_encoder_input_tokens,\n                getattr(self.model_config.hf_config,\
    \ \"max_source_positions\", 0),\n            )\n\n        block_sizes = []\n        max_num_blocks_per_group = []\n        for kv_cache_group in kv_cache_config.kv_cache_groups:\n            spec =\
    \ kv_cache_group.kv_cache_spec\n            block_sizes.append(spec.block_size)\n            # When using DCP, each request's KV cache is sharded among different ranks.\n            # As a result, one\
    \ block on the current rank covers `block_size * cp_size`\n            # tokens in the full, global (unsharded) sequence.\n            max_num_blocks = cdiv(\n                block_table_max_model_len,\
    \ spec.block_size * self.dcp_size\n            )\n            # For Mamba/Hybrid Model, KVCaches need extra blocks for speculative tokens\n            if isinstance(spec, MambaSpec):\n             \
    \   max_num_blocks = (\n                    max_num_blocks if self.cache_config.enable_prefix_caching else 1\n                ) + spec.num_speculative_blocks\n                max_num_blocks = get_block_table_width(\n\
    \                    max_num_blocks, spec.block_size, token_alignment=None\n                )\n            else:\n                max_num_blocks = get_block_table_width(max_num_blocks, spec.block_size)\n\
    \            max_num_blocks_per_group.append(max_num_blocks)\n\n        self.attn_groups, attn_cg_support, self.kernel_block_sizes = init_attn_backend(\n            self.kv_cache_config, self.vllm_config,\
    \ self.device\n        )\n        attn_cg_support = attn_cg_support.narrow(\n            *self.model_state.get_additional_cg_support()\n        )\n        self.block_tables = BlockTables(\n        \
    \    block_sizes=block_sizes,\n            max_num_reqs=self.max_num_reqs,\n            max_num_batched_tokens=self.max_num_tokens,\n            max_num_blocks_per_group=max_num_blocks_per_group,\n\
    \            device=self.device,\n            kernel_block_sizes=self.kernel_block_sizes,\n            cp_size=self.dcp_size,\n            cp_rank=self.dcp_rank,\n            cp_interleave=self.cp_interleave,\n\
    \        )\n        self.pcp_manager = pcp.maybe_build_pcp_manager(\n            self.vllm_config,\n            self.device,\n            self.supports_mm_inputs,\n            self.req_states,\n   \
    \         self.block_tables,\n        )\n        initialize_mamba_ssu_backend(\n            self.vllm_config.mamba_config, self.kv_cache_config\n        )\n        cudagraph_mode = self.compilation_config.resolve_cudagraph_mode_and_sizes(\n\
    \            attn_cg_support.min_cg_support,\n            attn_cg_support.min_cg_attn_backend,\n            self.decode_query_len,\n            use_v2_model_runner=True,\n            tensor_parallel_size=self.parallel_config.tensor_parallel_size,\n\
    \            kv_cache_config=self.kv_cache_config,\n            max_num_reqs=self.max_num_reqs,\n        )\n        self.cudagraph_manager = ModelCudaGraphManager(\n            self.vllm_config,\n \
    \           self.device,\n            cudagraph_mode,\n            decode_query_len=self.decode_query_len,\n            lora_capture_cases=self.lora_capture_cases,\n        )\n        check_attention_cp_compatibility(self.vllm_config)\n\
    \        if isinstance(self.speculator, DraftModelSpeculator):\n            # HACK(woosuk)\n            self.speculator.set_attn(\n                self.model_state,\n                self.kv_cache_config,\n\
    \                self.block_tables,\n                self.input_buffers,\n                self.attn_groups,\n            )\n        if self.speculator is not None:\n            # After set_attn, so\
    \ the speculator can size its cudagraph mode\n            # to its own attention support.\n            self.speculator.init_cudagraph_manager(cudagraph_mode)\n\n        self.kv_caches: list[torch.Tensor]\
    \ = []\n        kv_caches_dict = init_kv_cache(\n            self.kv_caches,\n            self.compilation_config.static_forward_context,\n            self.kv_cache_config,\n            self.attn_groups,\n\
    \            self.device,\n            self.cache_config.cache_dtype,\n            self.kernel_block_sizes,\n            self.vllm_config,\n        )\n        self.kv_connector = get_kv_connector(self.vllm_config,\
    \ kv_caches_dict)\n\n    def _init_kv_zero_meta(self) -> None:\n        \"\"\"Build KV-block zeroing metadata; invoked from gpu_worker.\"\"\"\n        self.kv_block_zeroer = KVBlockZeroer(\n       \
    \     self.device,\n            attn_groups_iter=(g for groups in self.attn_groups for g in groups),\n            kernel_block_sizes=self.kernel_block_sizes,\n            cache_dtype=self.cache_config.cache_dtype,\n\
    \            static_forward_context=self.compilation_config.static_forward_context,\n        )\n\n    @torch.inference_mode()\n    @step_eplb_after(is_dummy=True)\n    def _dummy_run(\n        self,\n\
    \        num_tokens: int,\n        *args,\n        skip_attn: bool = False,\n        uniform_decode: bool = False,\n        skip_eplb: bool = False,\n        is_profile: bool = False,\n        **kwargs,\n\
