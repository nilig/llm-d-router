    \ = self.execute_model_state.finished_req_ids\n        self.execute_model_state = None\n\n        # Post-step KV connector related operations.\n        kv_connector_output = self.kv_connector.post_forward(finished_req_ids)\n\
    \n        if not self.is_last_pp_rank:\n            self.postprocess_num_computed_tokens(input_batch)\n            return ModelRunnerOutput.with_kv_conn_output_only(kv_connector_output)\n\n        assert\
    \ self.pooling_runner is not None\n        pooler_output, is_valid = self.pooling_runner.pool(\n            hidden_states, input_batch, self.req_states\n        )\n\n        # Build the model runner\
    \ output.\n        model_runner_output = ModelRunnerOutput(\n            req_ids=input_batch.req_ids,\n            req_id_to_index={req_id: i for i, req_id in enumerate(input_batch.req_ids)},\n    \
    \        kv_connector_output=kv_connector_output,\n        )\n        async_output = AsyncPoolingOutput(\n            model_runner_output=model_runner_output,\n            pooler_output=pooler_output,\n\
    \            is_valid=is_valid,\n            main_stream=self.main_stream,\n            copy_stream=self.output_copy_stream,\n        )\n\n        self.postprocess_num_computed_tokens(input_batch)\n\
    \        return async_output\n\n    def postprocess_num_computed_tokens(self, input_batch: InputBatch) -> None:\n        # Update the number of computed tokens.\n        post_update_num_computed_tokens(\n\
    \            input_batch.idx_mapping,\n            self.req_states.num_computed_tokens.gpu,\n            input_batch.query_start_loc,\n        )\n\n    def shutdown(self) -> None:\n        \"\"\"Release\
    \ GPU tensors (model weights, KV caches, workspace) so that\n        memory is reclaimable when running in the same process.\"\"\"\n        torch.accelerator.synchronize()\n        if hasattr(self,\
    \ \"kv_caches\"):\n            self.kv_caches.clear()\n        if hasattr(self, \"attn_groups\"):\n            self.attn_groups.clear()\n        if hasattr(self, \"kv_cache_config\"):\n            del\
    \ self.kv_cache_config\n        free_before_shutdown(self.vllm_config)\n        if hasattr(self, \"model_state\"):\n            del self.model_state\n        if getattr(self, \"speculator\", None) is\
    \ not None:\n            self.speculator = None\n        if hasattr(self, \"model\"):\n            del self.model\n\n        gc.collect()\n        torch.accelerator.empty_cache()\n        logger.debug(\"\
    Cleaned up model weights, KV caches, and workspace\")\n\n    ########### EPLB methods start ###########\n    @property\n    def eplb_state(self):\n        return self.eplb.state\n\n    @eplb_state.setter\n\
    \    def eplb_state(self, state) -> None:\n        self.eplb.state = state\n\n    @property\n    def eep_eplb_suppressed(self) -> bool:\n        return self.eplb.suppressed\n\n    @eep_eplb_suppressed.setter\n\
    \    def eep_eplb_suppressed(self, suppressed: bool) -> None:\n        self.eplb.suppressed = suppressed\n\n    def setup_eplb_from_mapping(\n        self,\n        expanded_physical_to_logical: torch.Tensor,\n\
    \        old_num_physical_experts: int,\n    ) -> None:\n        self.eplb.setup_from_mapping(\n            self.model,\n            self.model_config,\n            expanded_physical_to_logical,\n \
    \           old_num_physical_experts,\n        )\n\n    ########### EPLB methods end ###########\n\n\nclass ExecuteModelState(NamedTuple):\n    input_batch: InputBatch\n    attn_metadata: dict[str,\
    \ Any] | None\n    slot_mappings_by_layer: dict[str, torch.Tensor] | None\n    hidden_states: torch.Tensor | None\n    aux_hidden_states: list[torch.Tensor] | None\n    finished_req_ids: set[str]\n\n\
    \ndef sort_batch_req_ids(\n    num_tokens_per_req: dict[str, int], decode_query_len: int\n) -> list[str]:\n    # Order decode -> short_extend -> prefill; split_decodes_and_prefills\n    # relies on\
    \ uniform decodes (query_len == decode_query_len) leading.\n    key = lambda r: ((num := num_tokens_per_req[r]) != decode_query_len, num)\n    return sorted(num_tokens_per_req, key=key)\n"
