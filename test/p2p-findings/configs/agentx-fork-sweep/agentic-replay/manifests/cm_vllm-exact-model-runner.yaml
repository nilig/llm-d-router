    \ self.pcp_manager.prepare_attn(input_batch)\n\n        # Block tables: num_kv_cache_groups x [num_reqs_padded, max_num_blocks].\n        block_tables = self.block_tables.gather_block_tables(\n    \
    \        input_batch.idx_mapping,\n            num_reqs_padded=input_batch.num_reqs_after_padding,\n        )\n        # Slot mappings: [num_kv_cache_groups, num_tokens_padded].\n        # Kernel pads\
    \ beyond num_tokens with PAD_SLOT_ID.\n        slot_mappings = self.block_tables.compute_slot_mappings(\n            input_batch.idx_mapping,\n            input_batch.query_start_loc,\n            input_batch.positions,\n\
    \            num_tokens_padded=input_batch.num_tokens_after_padding,\n        )\n        return block_tables, slot_mappings\n\n    def prepare_dummy_attn(\n        self, input_batch: InputBatch\n  \
    \  ) -> tuple[tuple[torch.Tensor, ...], torch.Tensor]:\n        block_tables = self.block_tables.get_dummy_block_tables(input_batch.num_reqs)\n        slot_mappings = pcp.maybe_get_pcp_dummy_slot_mappings(\n\
    \            self.pcp_manager, self.block_tables, input_batch.num_tokens\n        )\n        return block_tables, slot_mappings\n\n    def sample(\n        self,\n        hidden_states: torch.Tensor,\n\
    \        input_batch: InputBatch,\n        grammar_output: GrammarOutput | None,\n    ) -> tuple[SamplerOutput, torch.Tensor, torch.Tensor]:\n        sample_hidden_states = hidden_states[input_batch.logits_indices]\n\
    \        logits = self.model.compute_logits(sample_hidden_states)\n        if grammar_output is not None:\n            # Apply grammar bitmask to the logits in-place.\n            assert self.structured_outputs_worker\
    \ is not None\n            self.structured_outputs_worker.apply_grammar_bitmask(\n                logits,\n                input_batch,\n                grammar_output.structured_output_request_ids,\n\
    \                grammar_output.grammar_bitmask,\n            )\n\n        if input_batch.num_draft_tokens == 0 or self.rejection_sampler is None:\n            assert self.sampler is not None\n    \
    \        sampler_output = self.sampler(logits, input_batch)\n        else:\n            # Rejection sampling for spec decoding.\n            assert self.rejection_sampler is not None\n            assert\
    \ self.speculator is not None\n            sampler_output = self.rejection_sampler(\n                logits,\n                input_batch,\n                # Draft logits are needed for probabilistic\
    \ rejection sampling.\n                self.speculator.draft_logits,\n            )\n\n        return sampler_output, sampler_output.num_sampled, sampler_output.num_rejected\n\n    def postprocess_sampled(\n\
    \        self,\n        idx_mapping: torch.Tensor,  # May include -1 for masked entries\n        sampled_tokens: torch.Tensor,\n        num_sampled: torch.Tensor,\n        num_rejected: torch.Tensor,\n\
    \        query_start_loc: torch.Tensor | None = None,\n    ) -> None:\n        # Update the number of computed tokens.\n        if self.is_last_pp_rank:\n            assert self.sampler is not None\n\
    \            output_bin_counts = self.sampler.penalties_state.output_bin_counts\n        else:\n            output_bin_counts = None\n        post_update(\n            idx_mapping,\n            self.req_states.num_computed_tokens.gpu,\n\
    \            self.req_states.last_sampled_tokens,\n            output_bin_counts,\n            sampled_tokens,\n            num_sampled,\n            num_rejected,\n            query_start_loc,\n  \
    \          self.req_states.all_token_ids.gpu,\n            self.req_states.total_len.gpu,\n        )\n\n        self.model_state.postprocess_state(\n            idx_mapping, num_sampled, self.req_states.num_computed_tokens.gpu\n\
    \        )\n\n    @torch.inference_mode()\n    def execute_model(\n        self,\n        scheduler_output: SchedulerOutput,\n        intermediate_tensors: IntermediateTensors | None = None,\n     \
    \   dummy_run: bool = False,\n        skip_attn_for_dummy_run: bool = False,\n        is_profile: bool = False,\n    ) -> ModelRunnerOutput | IntermediateTensors | None:\n        if not dummy_run:\n\
    \            # Update the request states.\n            self.update_pp_decode_requests()\n            self.finish_requests(scheduler_output)\n            self.free_states(scheduler_output)\n        \
    \    self.add_requests(scheduler_output)\n            self.update_requests(scheduler_output)\n            self.block_tables.apply_staged_writes()\n            if scheduler_output.total_num_scheduled_tokens\
    \ == 0:\n                # No need to run the model.\n                empty_output = self.kv_connector.no_forward(scheduler_output)\n                return empty_output\n\n        # Get batch descriptor\
    \ and sync across DP ranks.\n        num_reqs = len(scheduler_output.num_scheduled_tokens)\n        num_toks = scheduler_output.total_num_scheduled_tokens\n        max_query_len = max(scheduler_output.num_scheduled_tokens.values())\n\
    \        uniform_tok_count = get_uniform_token_count(num_reqs, num_toks, max_query_len)\n\n        num_active_loras = 0\n        if self.lora_config:\n            req_ids = list(scheduler_output.num_scheduled_tokens.keys())\n\
    \            num_active_loras = get_num_active_loras_for_dispatch(\n                self.lora_config, self.lora_state, req_ids, dummy_run\n            )\n\n        skip_compiled = False\n        if\
    \ self.is_encoder_decoder and scheduler_output.scheduled_encoder_inputs:\n            # Encoder-decoder models such as Whisper should run eager/non-compiled\n            # when encoder inputs are scheduled,\
