    \ or skip_compiled,\n            num_active_loras=num_active_loras,\n        )\n\n        if batch_desc.num_tokens == 0:\n            # All DP ranks have zero tokens to run.\n            empty_output\
    \ = self.kv_connector.no_forward(scheduler_output)\n            return empty_output\n\n        if not dummy_run:\n            # Common case.\n            # Prepare all the inputs and copy to the input\
