apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  annotations:
    llm-d.ai/owner: cwtoken-uxnmxiHwoLe4TCnEPqCF5-maroon-kermit
  labels:
    llm-d.ai/model: GLM-5.2-FP8
    llm-d.ai/role: decode
  name: glm-5-2-decode
  namespace: maroon-precise-kv
spec:
  leaderWorkerTemplate:
    restartPolicy: RecreateGroupOnPodRestart
    size: 1
    workerTemplate:
      metadata:
        annotations:
          testing.llm-d.ai/restartedAt: '2026-08-09T17:41:00Z'
        labels:
          llm-d.ai/inference-serving: 'true'
          llm-d.ai/model: GLM-5.2-FP8
          llm-d.ai/role: decode
      spec:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                  - g121e9c
                  - g1251ac
        containers:
        - args:
          - "find /dev/shm -type f -delete\n\n# Apply the GLM block-table alignment fix (vllm#50302, merged\n# upstream Jul 31) onto the Jul 29 nightly, reproducing the P2P\n# testbed's engine build from\
            \ public artifacts.\nSITE=$(python3 -c 'import vllm, os; print(os.path.dirname(os.path.dirname(vllm.__file__)))')\nif (cd \"$SITE\" && git apply --check /hotfix/50302.diff 2>/dev/null); then\n\
            \  (cd \"$SITE\" && git apply /hotfix/50302.diff) && echo \"PATCHED vllm#50302 via git apply\"\nelse\n  (cd \"$SITE\" && patch -p1 --forward < /hotfix/50302.diff) && echo \"PATCHED vllm#50302\
            \ via patch\"\nfi\n\n# Scale MAX_TOKENS with number of decode pods\nexport MAX_TOKENS=$(( ${MAX_TOKENS_PER_NODE:-128} * LWS_GROUP_SIZE ))\n\n# Wide-EP (multi-node): reserve VRAM for NVSHMEM\
            \ symmetric heap\nGPU_MEM_UTIL=${DECODE_GPU_MEM_UTIL:-0.95}\n\n# DeepEP low-latency requires: qp_depth >= (max_dispatch_tokens + 1) * 2\nexport NVSHMEM_QP_DEPTH=$(( (MAX_TOKENS + 1) * 2 ))\n\
            \nMTP_ARGS=\"\"\nif [ \"${ENABLE_MTP:-1}\" = \"1\" ]; then\n  MTP_ARGS=\"--speculative-config {\\\"method\\\":\\\"mtp\\\",\\\"num_speculative_tokens\\\":${MTP_NUM_TOKENS:-3}}\"\nfi\n\n# Same\
            \ global-DP-rank port compensation as the prefill manifest;\n# see llm-d-router issue #2227.\nSTART_RANK=$(( ${LWS_WORKER_INDEX:-0} * DP_SIZE_LOCAL ))\nKV_EVENTS_BASE=$((5557 - START_RANK))\n\
            KV_EVENTS_ARGS=\"--kv-events-config {\\\"enable_kv_cache_events\\\":true,\\\"publisher\\\":\\\"zmq\\\",\\\"endpoint\\\":\\\"tcp://*:${KV_EVENTS_BASE}\\\",\\\"topic\\\":\\\"kv@${POD_IP}:8000@zai-org/GLM-5.2-FP8\\\
            \"}\"\n\nKV_TRANSFER_CONFIG='{\"kv_connector\":\"MultiConnector\",\"kv_role\":\"kv_both\",\"kv_load_failure_policy\":\"recompute\",\"kv_connector_extra_config\":{\"connectors\":[{\"kv_connector\"\
            :\"NixlConnector\",\"kv_role\":\"kv_both\"}]}}'\n\nexec vllm serve $MTP_ARGS --kv-cache-dtype fp8 \\\n  zai-org/GLM-5.2-FP8 \\\n  --port 8200 \\\n  --trust-remote-code \\\n  --gpu-memory-utilization\
            \ $GPU_MEM_UTIL \\\n  --max-model-len ${MAX_MODEL_LEN:-120000} \\\n  --disable-access-log-for-endpoints=/health,/metrics \\\n  --data-parallel-multi-port-external-lb \\\n  --data-parallel-supervisor-port=8208\
            \ \\\n  --enable-expert-parallel \\\n  --tensor-parallel-size $TP_SIZE \\\n  --max-num-batched-tokens ${MAX_TOKENS} \\\n  --max-num-seqs ${MAX_TOKENS} \\\n  --data-parallel-size $((LWS_GROUP_SIZE\
            \ * DP_SIZE_LOCAL)) \\\n  --data-parallel-size-local $DP_SIZE_LOCAL \\\n  --data-parallel-address ${LWS_LEADER_ADDRESS} \\\n  --data-parallel-rpc-port 5555 \\\n  --data-parallel-start-rank $START_RANK\
            \ \\\n  --block-size 64 \\\n  $KV_EVENTS_ARGS \\\n  --kv_transfer_config \"$KV_TRANSFER_CONFIG\" \\\n  --all2all-backend deepep_low_latency \\\n  --moe-backend deep_gemm \\\n  --reasoning-parser\
            \ glm45 \\\n  --tool-call-parser glm47 \\\n  --enable-auto-tool-choice\n"
          command:
          - /bin/bash
          - -c
          env:
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: PYTHONHASHSEED
            value: '0'
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                key: HF_TOKEN
                name: llm-d-hf-token
          - name: HF_HOME
            value: /mnt/hf-cache
          - name: MAX_TOKENS_PER_NODE
            value: '128'
          - name: MAX_MODEL_LEN
            value: '120000'
          - name: ENABLE_MTP
            value: '1'
          - name: MTP_NUM_TOKENS
            value: '3'
          - name: VLLM_USE_V2_MODEL_RUNNER
            value: '0'
          - name: VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS
            value: '1'
          - name: VLLM_RANDOMIZE_DP_DUMMY_INPUTS
            value: '1'
          - name: DP_SIZE_LOCAL
            value: '8'
          - name: TP_SIZE
            value: '1'
          - name: TRITON_LIBCUDA_PATH
            value: /usr/lib64
          - name: VLLM_SKIP_P2P_CHECK
            value: '1'
          - name: VLLM_USE_DEEP_GEMM
            value: '1'
          - name: NVIDIA_GDRCOPY
            value: enabled
          - name: NVSHMEM_REMOTE_TRANSPORT
            value: ibgda
          - name: NVSHMEM_IB_ENABLE_IBGDA
            value: 'true'
          - name: NVSHMEM_BOOTSTRAP_UID_SOCK_IFNAME
            value: eth0
          - name: GLOO_SOCKET_IFNAME
            value: eth0
          - name: NCCL_SOCKET_IFNAME
            value: eth0
          - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
            value: '120'
          - name: VLLM_NIXL_SIDE_CHANNEL_HOST
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: NCCL_IB_HCA
            value: ibp
          - name: NVSHMEM_HCA_PREFIX
            value: ibp
          - name: VLLM_LOGGING_LEVEL
            value: INFO
          - name: CUDA_CACHE_PATH
            value: /var/cache/vllm/cuda
          - name: CCACHE_DIR
            value: /var/cache/vllm/ccache
          - name: VLLM_CACHE_ROOT
            value: /var/cache/vllm/vllm
          - name: FLASHINFER_WORKSPACE_BASE
            value: /var/cache/vllm/flashinfer
          image: quay.io/niliguy/vllm-openai:nightly-6f91edf9-pr50302
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: supervisor
            periodSeconds: 30
            timeoutSeconds: 5
          name: vllm
          ports:
          - containerPort: 8200
            name: dp0
            protocol: TCP
          - containerPort: 8201
            name: dp1
            protocol: TCP
          - containerPort: 8202
            name: dp2
            protocol: TCP
          - containerPort: 8203
            name: dp3
            protocol: TCP
          - containerPort: 8204
            name: dp4
            protocol: TCP
          - containerPort: 8205
            name: dp5
            protocol: TCP
          - containerPort: 8206
            name: dp6
            protocol: TCP
          - containerPort: 8207
            name: dp7
            protocol: TCP
          - containerPort: 8208
            name: supervisor
            protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /readyz
              port: supervisor
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              cpu: '32'
              ephemeral-storage: 1Ti
              memory: 1500Gi
              nvidia.com/gpu: '8'
              rdma/ib: '8'
            requests:
              cpu: '32'
              ephemeral-storage: 1Ti
              memory: 1500Gi
              nvidia.com/gpu: '8'
              rdma/ib: '8'
          securityContext:
            capabilities:
              add:
              - IPC_LOCK
              - SYS_RAWIO
            runAsGroup: 0
            runAsUser: 0
          startupProbe:
            failureThreshold: 2700
            httpGet:
              path: /health
              port: supervisor
            periodSeconds: 1
          volumeMounts:
          - mountPath: /hotfix
            name: vllm-hotfix
            readOnly: true
          - mountPath: /dev/shm
            name: dshm
          - mountPath: /mnt/hf-cache
            name: hf-cache
          - mountPath: /var/cache/vllm
            name: jit-cache
          - mountPath: /usr/local/lib/python3.12/dist-packages/vllm/v1/worker/gpu/model_runner.py
            name: vllm-exact-model-runner
            readOnly: true
            subPath: model_runner.py
        initContainers:
        - args:
          - --port=8000
          - --vllm-port=8200
          - --data-parallel-size=8
          - --kv-connector=nixlv2
          - --zap-log-level=1
          - --secure-proxy=false
          - --enable-prefiller-sampling
          - --enable-p2p-pull
          - --p2p-connector-port=7777
          image: ghcr.io/llm-d/llm-d-router-disagg-sidecar:main@sha256:a6e9f4e3b62a79f5b525e713abf0e340c2cdf4437aff59d2659b59a183ad0dd9
          imagePullPolicy: Always
          name: routing-proxy
          ports:
          - containerPort: 8000
            name: rank0
            protocol: TCP
          - containerPort: 8001
            name: rank1
            protocol: TCP
          - containerPort: 8002
            name: rank2
            protocol: TCP
          - containerPort: 8003
            name: rank3
            protocol: TCP
          - containerPort: 8004
            name: rank4
            protocol: TCP
          - containerPort: 8005
            name: rank5
            protocol: TCP
          - containerPort: 8006
            name: rank6
            protocol: TCP
          - containerPort: 8007
            name: rank7
            protocol: TCP
          resources: {}
          restartPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
        serviceAccountName: glm-5-2
        volumes:
        - configMap:
            name: vllm-hotfix-50302
          name: vllm-hotfix
        - emptyDir:
            medium: Memory
            sizeLimit: 1500Gi
          name: dshm
        - hostPath:
            path: /mnt/local/hf-cache
            type: DirectoryOrCreate
          name: hf-cache
        - hostPath:
            path: /mnt/local/jit-cache
            type: DirectoryOrCreate
          name: jit-cache
        - configMap:
            name: vllm-exact-model-runner
          name: vllm-exact-model-runner
  networkConfig:
    subdomainPolicy: Shared
  replicas: 2
  rolloutStrategy:
    rollingUpdateConfiguration:
      maxSurge: 0
      maxUnavailable: 1
      partition: 0
    type: RollingUpdate
  startupPolicy: LeaderCreated

