apiVersion: v1
kind: Service
metadata:
  labels:
    app: p2p-pd-epp
  name: agentx-slo-epp
  namespace: maroon-precise-kv
spec:
  clusterIP: 10.16.0.66
  clusterIPs:
  - 10.16.0.66
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: grpc
    port: 9002
    protocol: TCP
    targetPort: 9002
  - name: metrics
    port: 9090
    protocol: TCP
    targetPort: 9090
  - name: http-8081
    port: 8081
    protocol: TCP
    targetPort: 8081
  - name: http
    port: 80
    protocol: TCP
    targetPort: 8081
  selector:
    app: agentx-slo-epp
  sessionAffinity: None
  type: ClusterIP

