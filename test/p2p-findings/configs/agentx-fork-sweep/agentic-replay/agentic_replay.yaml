load:
  type: concurrent
  num_workers: 8
  worker_max_concurrency: 1000
  request_timeout: 600
  stages:
    - num_requests: 1200
      concurrency_level: 60
api:
  type: completion
  streaming: true
server:
  type: vllm
  model_name: zai-org/GLM-5.2-FP8
  base_url: http://10.16.0.66
tokenizer:
  pretrained_model_name_or_path: zai-org/GLM-5.2-FP8
data:
  type: conversation_replay
  conversation_replay:
    seed: 67
    max_model_len: 120000
    num_conversations: 60
    shared_system_prompt_len: 3000
    dynamic_system_prompt_len:
      type: lognormal
      min: 10000
      max: 100000
      mean: 73000
      std_dev: 107000
    turns_per_conversation:
      type: lognormal
      min: 1
      max: 3000
      mean: 540
      std_dev: 48600
    input_tokens_per_turn:
      type: lognormal
      min: 100
      max: 10000
      mean: 1500
      std_dev: 1200
    output_tokens_per_turn:
      type: lognormal
      min: 50
      max: 10000
      mean: 425
      std_dev: 825
    tool_call_latency_sec:
      type: lognormal
      min: 1
      max: 100
      mean: 15
      std_dev: 55
report:
  request_lifecycle:
    summary: true
    per_stage: true
    per_request: true
storage:
  local_storage:
    path: /workspace
