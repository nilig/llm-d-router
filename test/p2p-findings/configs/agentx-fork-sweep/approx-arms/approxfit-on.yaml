# Fitted-approximate treatment: approxfit-off plus the p2p-source-producer
# fed by the fitted cpu horizon (a producer serves pulls from its offload
# tier, so tier persistence is what makes a source real). Wrong source
# beliefs fail the pull under kv_load_failure_policy: fail - record
# failed-pull counts as part of the result.
apiVersion: llm-d.ai/v1alpha1
kind: EndpointPickerConfig
plugins:
- type: disagg-headers-handler
- type: always-disagg-pd-decider
- type: disagg-profile-handler
  parameters:
    deciderPluginName: always-disagg-pd-decider
- type: prefill-filter
- type: decode-filter
- type: approx-prefix-cache-producer
  name: gpu-prefix-cache-producer
  parameters:
    blockSizeTokens: 64
- type: approx-prefix-cache-producer
  name: cpu-prefix-cache-producer
  parameters:
    autoTune: false
    blockSizeTokens: 64
    # FITTED - the one change from the wide-ep-lws guide's shipped value
    # (200000). Must equal the engine boot line "primary tier (lru, N blocks)"
    # for the prefill role: 20 GiB/rank, fp8 KV, 64-token blocks -> 6124.
    # fit_check.sh asserts this against live engines and refuses on mismatch.
    lruCapacityPerServer: 6124
- type: prefix-cache-scorer
  name: gpu-prefix-cache-scorer
  parameters:
    prefixMatchInfoProducerName: gpu-prefix-cache-producer
- type: prefix-cache-scorer
  name: cpu-prefix-cache-scorer
  parameters:
    prefixMatchInfoProducerName: cpu-prefix-cache-producer
- type: queue-scorer
- type: active-request-scorer
- type: p2p-source-producer
  parameters:
    prefixMatchInfoProducerName: cpu-prefix-cache-producer
    prefillProfileName: prefill
    minCachedTokenDelta: 12288
schedulingProfiles:
- name: prefill
  plugins:
  - pluginRef: prefill-filter
  - pluginRef: gpu-prefix-cache-scorer
    weight: 5
  - pluginRef: cpu-prefix-cache-scorer
    weight: 2
  - pluginRef: active-request-scorer
    weight: 1
- name: decode
  plugins:
  - pluginRef: decode-filter
  - pluginRef: active-request-scorer
    weight: 3
