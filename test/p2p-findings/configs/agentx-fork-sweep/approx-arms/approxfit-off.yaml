# Fitted-approximate baseline: the wide-ep-lws guide's approximate policy
# (dual gpu+cpu prefix scorers, weights 5/2/1) verbatim, with ONE change:
# the cpu horizon's lruCapacityPerServer fitted to the real tier (6124
# blocks) instead of the shipped 200000. Pair: approxfit-on.yaml.
# blockSizeTokens pinned to 64 to match the engine (defaults trigger the
# below-minimum override warning). Token-producer omitted per the guide form.
apiVersion: llm-d.ai/v1alpha1
kind: EndpointPickerConfig
plugins:
- type: disagg-headers-handler
- type: always-disagg-pd-decider
- type: disagg-profile-handler
  parameters:
    deciderPluginName: always-disagg-pd-decider
- type: prefill-filter
- type: decode-filter
- type: approx-prefix-cache-producer
  name: gpu-prefix-cache-producer
  parameters:
    blockSizeTokens: 64
- type: approx-prefix-cache-producer
  name: cpu-prefix-cache-producer
  parameters:
    autoTune: false
    blockSizeTokens: 64
    # FITTED - the one change from the wide-ep-lws guide's shipped value
    # (200000). Must equal the engine boot line "primary tier (lru, N blocks)"
    # for the prefill role: 20 GiB/rank, fp8 KV, 64-token blocks -> 6124.
    # fit_check.sh asserts this against live engines and refuses on mismatch.
    lruCapacityPerServer: 6124
- type: prefix-cache-scorer
  name: gpu-prefix-cache-scorer
  parameters:
    prefixMatchInfoProducerName: gpu-prefix-cache-producer
- type: prefix-cache-scorer
  name: cpu-prefix-cache-scorer
  parameters:
    prefixMatchInfoProducerName: cpu-prefix-cache-producer
- type: queue-scorer
- type: active-request-scorer
schedulingProfiles:
- name: prefill
  plugins:
  - pluginRef: prefill-filter
  - pluginRef: gpu-prefix-cache-scorer
    weight: 5
  - pluginRef: cpu-prefix-cache-scorer
    weight: 2
  - pluginRef: active-request-scorer
    weight: 1
- name: decode
  plugins:
  - pluginRef: decode-filter
  - pluginRef: active-request-scorer
    weight: 3
