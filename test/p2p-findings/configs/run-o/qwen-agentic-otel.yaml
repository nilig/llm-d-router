load:
  type: trace_session_replay
  stages:
    - concurrent_sessions: 4
  worker_max_concurrency: 400
  base_seed: 42
api:
  type: chat
  streaming: true
server:
  type: vllm
  model_name: Qwen/Qwen3-30B-A3B-Thinking-2507
  base_url: http://llm-d-router-epp.nilig-p2p.svc.cluster.local:8081
  ignore_eos: true
tokenizer:
  pretrained_model_name_or_path: Qwen/Qwen3-30B-A3B-Thinking-2507
data:
  type: otel_trace_replay
  otel_trace_replay:
    skip_invalid_files: true
    use_static_model: true
    static_model_name: Qwen/Qwen3-30B-A3B-Thinking-2507
    trace_directory: /workspace/inference-perf/examples/otel/test_traces/advanced
    include_errors: false
report:
  request_lifecycle:
    summary: true
    per_stage: true
    per_request: true
storage:
  local_storage:
    path: /workspace
