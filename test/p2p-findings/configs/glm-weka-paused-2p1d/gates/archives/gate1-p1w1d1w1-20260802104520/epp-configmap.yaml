apiVersion: v1
data:
  armA-blog-plugins.yaml: |
    apiVersion: llm-d.ai/v1alpha1
    kind: EndpointPickerConfig
    plugins:
    - type: disagg-headers-handler
    - type: always-disagg-pd-decider
    - type: disagg-profile-handler
      parameters:
        deciderPluginName: always-disagg-pd-decider
    - type: prefill-filter
    - type: decode-filter
    - type: approx-prefix-cache-producer
      name: gpu-prefix-cache-producer
    - type: approx-prefix-cache-producer
      name: cpu-prefix-cache-producer
      parameters:
        autoTune: false
        lruCapacityPerServer: 200000
    - type: prefix-cache-scorer
      name: gpu-prefix-cache-scorer
      parameters:
        prefixMatchInfoProducerName: gpu-prefix-cache-producer
    - type: prefix-cache-scorer
      name: cpu-prefix-cache-scorer
      parameters:
        prefixMatchInfoProducerName: cpu-prefix-cache-producer
    - type: queue-scorer
    - type: active-request-scorer
    schedulingProfiles:
    - name: prefill
      plugins:
      - pluginRef: prefill-filter
      - pluginRef: gpu-prefix-cache-scorer
        weight: 5
      - pluginRef: cpu-prefix-cache-scorer
        weight: 2
      - pluginRef: active-request-scorer
        weight: 1
    - name: decode
      plugins:
      - pluginRef: decode-filter
      - pluginRef: active-request-scorer
        weight: 3
  armB-loadfirst.yaml: |
    apiVersion: llm-d.ai/v1alpha1
    kind: EndpointPickerConfig
    plugins:
    - type: disagg-headers-handler
    - type: always-disagg-pd-decider
    - type: disagg-profile-handler
      parameters:
        deciderPluginName: always-disagg-pd-decider
    - type: prefill-filter
    - type: decode-filter
    - type: token-producer
      parameters:
        modelName: zai-org/GLM-5.2-FP8
        vllm:
          url: http://render:8000
    - type: endpoint-notification-source
    - type: metrics-data-source
      parameters:
        scheme: http
        path: /metrics
        insecureSkipVerify: true
    - type: core-metrics-extractor
    - type: precise-prefix-cache-producer
      parameters:
        indexerConfig:
          kvBlockIndexConfig:
            inMemoryConfig:
              podCacheSize: 64
        tokenProcessorConfig:
          blockSize: 64
        kvEventsConfig:
          topicFilter: "kv@"
          discoverPods: true
          podDiscoveryConfig:
            socketPort: 5557
    - type: prefix-cache-scorer
      name: precise-prefix-cache-scorer
      parameters:
        prefixMatchInfoProducerName: precise-prefix-cache-producer
    - type: queue-scorer
    - type: active-request-scorer
    dataLayer:
      sources:
      - pluginRef: metrics-data-source
        extractors:
        - pluginRef: core-metrics-extractor
      - pluginRef: endpoint-notification-source
        extractors:
        - pluginRef: precise-prefix-cache-producer
    schedulingProfiles:
    - name: prefill
      plugins:
      - pluginRef: prefill-filter
      - pluginRef: precise-prefix-cache-scorer
        weight: 1
      - pluginRef: queue-scorer
        weight: 3
      - pluginRef: active-request-scorer
        weight: 1
    - name: decode
      plugins:
      - pluginRef: decode-filter
      - pluginRef: active-request-scorer
        weight: 3
