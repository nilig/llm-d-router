apiVersion: v1
kind: Service
metadata: {name: uc3-gptoss-decode, namespace: nilig-p2p}
spec:
  selector: {app: uc3-gptoss, role: decode}
  ports: [{name: proxy, port: 8000, targetPort: 8000}, {name: kv-events, port: 5556, targetPort: 5556}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: uc3-gptoss-render, namespace: nilig-p2p}
spec:
  replicas: 2
  selector: {matchLabels: {app: uc3-gptoss-render}}
  template:
    metadata: {labels: {app: uc3-gptoss-render}}
    spec:
      automountServiceAccountToken: false
      containers:
      - name: vllm-render
        image: docker.io/vllm/vllm-openai-cpu:v0.23.0
        command: ["vllm", "launch", "render", "openai/gpt-oss-120b", "--port=8000"]
        env:
        - {name: HF_TOKEN, valueFrom: {secretKeyRef: {name: llm-d-hf-token, key: HF_TOKEN}}}
        - {name: HOME, value: /tmp}
        ports: [{containerPort: 8000}]
        resources: {requests: {cpu: "2", memory: 8Gi}, limits: {memory: 16Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: uc3-gptoss-render, namespace: nilig-p2p}
spec:
  selector: {app: uc3-gptoss-render}
  ports: [{port: 8000, targetPort: 8000}]
