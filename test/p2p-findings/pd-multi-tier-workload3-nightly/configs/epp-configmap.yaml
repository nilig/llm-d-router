apiVersion: v1
data:
  default-plugins.yaml: |
    apiVersion: llm-d.ai/v1alpha1
    kind: EndpointPickerConfig
    plugins:
    - type: queue-scorer
    - type: kv-cache-utilization-scorer
    - type: prefix-cache-scorer
    - type: metrics-data-source
      parameters:
        scheme: "http"
        path: "/metrics"
        insecureSkipVerify: true
    - type: core-metrics-extractor
    schedulingProfiles:
    - name: default
      plugins:
      - pluginRef: queue-scorer
        weight: 2
      - pluginRef: kv-cache-utilization-scorer
        weight: 2
      - pluginRef: prefix-cache-scorer
        weight: 3
  payload-agnostic.yaml: |
    # Request-format agnostic routing. Use this when the request format is
    # unknown or unsupported, so the EPP cannot rely on scorers that read the
    # request body (e.g. the prefix-cache scorer). The passthrough parser does
    # not parse the body, and routing falls back to backend-state scorers:
    #   - active-request-scorer  : prefers the least busy endpoint
    #   - session-affinity-scorer: keeps a session pinned to the same endpoint
    # Select it by setting router.epp.pluginsConfigFile: payload-agnostic.yaml
    apiVersion: llm-d.ai/v1alpha1
    kind: EndpointPickerConfig
    plugins:
    - type: passthrough-parser
    - type: active-request-scorer
    - type: session-affinity-scorer
    requestHandler:
      parsers:
      - pluginRef: passthrough-parser
    schedulingProfiles:
    - name: default
      plugins:
      - pluginRef: active-request-scorer
        weight: 1
      - pluginRef: session-affinity-scorer
        weight: 1
  pd-config.yaml: |
    apiVersion: llm-d.ai/v1alpha1
    kind: EndpointPickerConfig
    plugins:
    - type: disagg-headers-handler
    - type: always-disagg-pd-decider
    - type: disagg-profile-handler
      parameters:
        deciderPluginName: always-disagg-pd-decider
    - type: prefill-filter
    - type: decode-filter
    - type: approx-prefix-cache-producer
      parameters:
        # 5k-ISL gpt-oss-120b reference workload; a modest match window
        # keeps EPP prefix-matching cheap.
        maxPrefixTokensToMatch: 131072
    - type: inflight-load-producer
    - type: prefix-cache-affinity-filter
      parameters:
        # Measured with guides/recipes/router/calibration/calibrate.sh
        # through the full P/D path on the reference fleet (gpt-oss-120b,
        # 8x prefill TP=1 on H200, chunk 8192). Includes the NIXL KV
        # transfer + sidecar hop, so it is the operational ceiling the
        # gate acts on. Re-measure for other hardware/models.
        peakPrefillThroughput: 33821
    - type: token-load-scorer
    - type: active-request-scorer
    - type: max-score-picker
    schedulingProfiles:
    # Prefill does the prompt pass: keep prefix groups on cache-warm pods
    # (affinity filter) and pick by queued prefill token load.
    - name: prefill
      plugins:
      - pluginRef: prefill-filter
      - pluginRef: prefix-cache-affinity-filter
      - pluginRef: token-load-scorer
      - pluginRef: max-score-picker
    # Pure decode is bound by concurrent in-flight requests, not prefill
    # throughput: pick the least-busy endpoint.
    - name: decode
      plugins:
      - pluginRef: decode-filter
      - pluginRef: active-request-scorer
      - pluginRef: max-score-picker
  pd-multi-tier.yaml: |
    apiVersion: llm-d.ai/v1alpha1
    kind: EndpointPickerConfig
    plugins:
    - type: disagg-headers-handler
    - type: always-disagg-pd-decider
    - type: disagg-profile-handler
      parameters:
        deciderPluginName: always-disagg-pd-decider
    - type: prefill-filter
    - type: decode-filter
    - type: token-producer
      parameters:
        modelName: openai/gpt-oss-120b
        vllm:
          url: http://pd-multi-tier-render:8000
    - type: endpoint-notification-source
    - type: metrics-data-source
      parameters:
        scheme: http
        path: /metrics
        insecureSkipVerify: true
    - type: core-metrics-extractor
    - type: precise-prefix-cache-producer
      parameters:
        indexerConfig:
          kvBlockIndexConfig:
            inMemoryConfig:
              # 8 prefills x (GPU + CPU) plus 2 GPU-only decoders need 18
              # holders per block; leave two entries of headroom.
              podCacheSize: 36
          kvCacheBackendConfigs:
          - name: gpu
            weight: 1.0
          - name: cpu
            weight: 0.4
        tokenProcessorConfig:
          # Must equal the engines' --block-size.
          blockSizeTokens: 128
        speculativeIndexing: true
        kvEventsConfig:
          topicFilter: "kv@"
          discoverPods: true
          podDiscoveryConfig:
            socketPort: 5556
    - type: prefix-cache-scorer
      name: precise-prefix-cache-scorer
      parameters:
        prefixMatchInfoProducerName: precise-prefix-cache-producer
    - type: queue-scorer
    - type: kv-cache-utilization-scorer
    - type: active-request-scorer
    dataLayer:
      sources:
      - pluginRef: metrics-data-source
        extractors:
        - pluginRef: core-metrics-extractor
      - pluginRef: endpoint-notification-source
        extractors:
        - pluginRef: precise-prefix-cache-producer
    schedulingProfiles:
    - name: prefill
      plugins:
      - pluginRef: prefill-filter
      - pluginRef: precise-prefix-cache-scorer
        weight: 3
      - pluginRef: queue-scorer
        weight: 2
      - pluginRef: kv-cache-utilization-scorer
        weight: 2
    - name: decode
      plugins:
      - pluginRef: decode-filter
      - pluginRef: active-request-scorer
        weight: 2
